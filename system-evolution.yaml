findings:
  - id: F001
    summary: One-pass prospective closure can approve and activate a graph that violates link multiplicity.
    classification: implementation defect
    consequence: A staged endpoint-type change can hide unchanged incident links, yield a clean assessment, and commit invalid active state.
    authority_refs: [VellisRequirements::proposalIsolation, VellisRequirements::validationCoverage, RTGSystem::'Activate proposed change']
    evidence_refs: [path:tests/vellis/test_sqlite_prospective_state.py#test_endpoint_type_change_cannot_activate_an_incomplete_multiplicity_closure]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Prospective validation visits each affected relation and participant only once, so a newly discovered participant's other incident links remain invisible.
    compatibility_effect: Invalid proposals become rejected with findings; valid proposal payloads, state, and history remain unchanged.
  - id: F002
    summary: MCP serialization rejects a large integral Decimal after the same value was accepted and stored.
    classification: implementation defect
    consequence: Querying 10**31 returns a typed failure and the activity ledger can disagree with the caller's final status.
    authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::mcpOutcomeIntegrity]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Storage is lossless but the MCP adapter eagerly expands or rejects integral Decimal values according to exponent size.
    compatibility_effect: Large accepted integers remain exact JSON-number tokens; ordinary compact integers retain their existing representation.
  - id: F003
    summary: New POSIX stores and imports can expose plaintext owner memory through permissive filesystem modes.
    classification: implementation defect
    consequence: Under an ordinary umask, database directories and files can grant group or other access, while insecure existing stores are opened without warning.
    authority_refs: [VellisRequirements::simpleIndividualOperation]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W003
    implementation_status: conflicting
    nearest_wrong_system: SQLite creates plaintext memory using ambient permissions and accepts symlinked, non-owner, or broadly accessible paths.
    compatibility_effect: POSIX stores require owner-only modes and ownership; insecure prerelease stores receive repair guidance and no automatic migration.
  - id: F004
    summary: Prospective direct-association multiplicity counts repeated anchor references instead of distinct associated-data identities.
    classification: implementation defect
    consequence: Stored prospective validation can disagree with modeled set semantics and the in-memory semantic validator.
    authority_refs: [VellisRequirements::definitionSemantics, VellisRequirements::validationCoverage]
    evidence_refs: [path:tests/vellis/test_sqlite_prospective_state.py#test_repeated_anchor_references_have_set_multiplicity_in_prospective_sql]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: One associated-data object referring to the same anchor twice counts as two association members.
    compatibility_effect: Duplicate references count once; distinct associated-data objects and all public formats remain unchanged.
  - id: F005
    summary: Oversized positive public row and finding maxima overflow SQLite integer bindings.
    classification: implementation defect
    consequence: Valid positive bounds such as 2**100 raise untyped OverflowError instead of returning the correct accepted result.
    authority_refs: [VellisRequirements::querySafety, VellisRequirements::validationCoverage, VellisRequirements::mcpOutcomeIntegrity]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Public arbitrary positive integers are passed directly into fixed-width SQLite LIMIT and fetchmany parameters.
    compatibility_effect: Large maxima behave like non-restrictive valid bounds; zero, negative, and ordinary over-bound behavior remains unchanged.
decisions:
  - id: D001
    summary: Compute prospective invariant closure monotonically in indexed SQLite temporary tables until neither relation nor participant membership grows.
    authority_refs: [VellisRequirements::proposalIsolation, VellisRequirements::validationCoverage]
    alternatives: [Construct a complete resident graph., Retain one-pass expansion.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [Reject the endpoint-type invalid-activation reproducer., Terminate on cyclic affected closures without scanning disconnected populations.]
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_sqlite_prospective_state.py#test_endpoint_type_change_cannot_activate_an_incomplete_multiplicity_closure
      - path:tests/vellis/test_sqlite_prospective_state.py#test_repeated_anchor_references_have_set_multiplicity_in_prospective_sql
  - id: D002
    summary: Preserve large integral Decimal values as exact JSON-number tokens and clamp only private SQLite limits and probes.
    authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::querySafety, VellisRequirements::mcpOutcomeIntegrity]
    alternatives: [Reject integers above a transport exponent threshold., Narrow the public positive-integer contract.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Round-trip 10**31 through both MCP result forms., Accept 2**63-1 and 2**100 bounds without canonical effects.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D003
    summary: Enforce owner-only POSIX storage modes and fail closed with chmod guidance instead of mutating insecure existing paths.
    authority_refs: [VellisRequirements::simpleIndividualOperation]
    alternatives: [Silently chmod prerelease stores., Rely on the ambient umask.]
    reversible: true
    owner_work_item_id: W003
    evidence_intent: [Create directories as 0700 and database artifacts as 0600 under umask 022., Refuse insecure existing paths without canonical effects.]
    implementation_status: not evaluated
    evidence_refs: []
