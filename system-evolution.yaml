findings:
  - id: F001
    summary: Current-work resource evidence is spread across overlapping scenario and measurement surfaces.
    classification: realization decision
    consequence: Equivalent histories, local mutations, and bounded query behavior are rebuilt and reread in several large files, increasing maintenance and review context without unique discrimination.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::boundedHistoricalSelectionWork
      - VellisVerification::currentWorkScaling
      - VellisVerification::historicalSelectionScaling
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_work_characterization.py tests/vellis/test_population_local_work.py -q
      - path:tests/vellis/test_work_characterization.py#test_a_narrow_historical_query_does_not_materialize_the_revision_population
      - path:tests/vellis/test_work_characterization.py#test_a_returned_result_is_bounded_without_scanning_or_hydrating_the_matching_population
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Removing overlapping cases also removes the sole evidence for one allowed scale driver, forbidden population dependency, or state-wide exception.
    compatibility_effect: Test organization changes only; resource authority and SQLite realization remain unchanged.
  - id: F002
    summary: Some realization-integrity tests assert source text or internal shape where dynamic behavior can discriminate the same property.
    classification: realization decision
    consequence: Harmless refactoring invalidates evidence even when population-local and bounded-memory behavior remains conforming.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisVerification::currentWorkScaling
    evidence_refs:
      - path:tests/vellis/test_population_local_work.py#test_one_tail_record_adds_bounded_vm_work_over_the_snapshot_import
      - path:tests/vellis/test_population_local_work.py#test_ordinary_writes_are_independent_of_unrelated_graph_population
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A full-state scan or recomputation returns correct answers and passes semantic tests while violating accepted resource shape.
    compatibility_effect: Retained dynamic SQLite instrumentation continues to verify the selected realization.
  - id: F003
    summary: Workflow validators and rich product fixtures contain repetitive cases and setup that can share tables or helpers without merging distinct lifecycle rules.
    classification: realization decision
    consequence: Repository-process and product evidence carries unnecessary setup and assertion volume, increasing context cost and churn.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - command:just check
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Mechanical consolidation accidentally erases a distinct stale-state, checkpoint, interruption, compatibility, or failure non-effect boundary.
    compatibility_effect: Validator contracts and product behavior remain unchanged.
decisions:
  - id: D001
    summary: Retain the classified 1,053 starting cases by unique discriminating value and consolidate mechanics beneath semantic scenarios.
    authority_refs:
      - VellisVerification::currentWorkScaling
      - VellisVerification::historicalSelectionScaling
      - AGENTS.md
    alternatives:
      - Preserve the closure-era suite unchanged.
      - Delete tests by size or count without claim-level review.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Classify cases as semantic behavior, compatibility or recovery, failure non-effect, resource characterization, realization integrity, or repository/process validation.
      - Keep prospective/governance and streaming/integrity cases separate where they reject different failures.
      - Every retained category names the plausible wrong system or workflow invariant it uniquely rejects.
      - Narrow cluster suites and the complete repository gate remain clean after subtraction.
      - Current evolution evidence references resolve to retained test nodes.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_work_characterization.py tests/vellis/test_population_local_work.py -q
      - command:uv run pytest tests/test_implementation_campaign.py tests/test_system_evolution.py -q
      - command:just check
