  objective: Resolve five prerelease implementation defects without changing accepted Vellis 2.0 meaning or compatibility.
  observable_distinction: Prospective activation cannot admit invalid state, exact numbers and positive bounds remain usable, and local POSIX memory is private or refused before use.
