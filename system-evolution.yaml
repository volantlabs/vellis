schema_version: "1.0"
evolution:
  id: vellis-2-prerelease-scaling-remediation
  objective: Remove population-sized resident aggregation, superlinear prospective assessment, and SQLite collection-limit failures without changing accepted Vellis 2.0 meaning or compatibility.
  observable_distinction: Ordinary prospective work follows only the affected invariant neighborhood, scalar aggregation keeps bounded process memory, and large valid collections do not fail at SQLite host-parameter boundaries.
  lifecycle: active
  approval: {status: not-required, reason: "Accepted query-safety and affected-invariant authority decides all three implementation defects.", checkpoint: null}
  blocker: null
  checkpoint: null
