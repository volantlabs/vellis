schema_version: "1.0"
evolution:
  id: vellis-2-simplification-rebaseline
  objective: Rebaseline Vellis v2 around a small scalar RTG, field-level changes, one draft, indexed history, and simple public boundaries.
  observable_distinction: Owners can query, change, draft, recover, migrate, and connect without recursive JSON, replacement updates, replay, private hooks, or implementation-shaped governance.
  lifecycle: active
  approval:
    status: accepted
    reason: The owner supplied and approved the decision-complete rebaseline plan; this checkpoint makes that accepted consequence reconstructible.
    checkpoint: git:d2723f131a11ae6b339c36311b4dabcc632c6bf5
  blocker: null
  checkpoint: null
baselines:
  status: current
  source: &source
    model: sha256:5ce0b4cbcc0785f57980d709bf903717f3323ef116f40a9f58737e6f06ac9240
    implementation: git:5196bb01fedb90c815ae15f40cddb041fc915d01
    language: sha256:054aab62276a55c43860e3d2daad5fae864db550b3a58ab110074f8b293996ff
    execution_environment: sha256:d71473693aa50faef1a25a449aa5808490e21eaf2a987942d1fb134c773550d1
    checkpoint: git:5196bb01fedb90c815ae15f40cddb041fc915d01
  target: &phase4_target
    model: sha256:8af0ac5250d5186b8baa693bc8ebcc2b5e69f0e130754fbc676cb2302bfa8794
    implementation: git:eba341978d18e4362d4aad875445a7d070ec1d58
    language: sha256:054aab62276a55c43860e3d2daad5fae864db550b3a58ab110074f8b293996ff
    execution_environment: sha256:d71473693aa50faef1a25a449aa5808490e21eaf2a987942d1fb134c773550d1
    checkpoint: git:eba341978d18e4362d4aad875445a7d070ec1d58
  observed: *phase4_target
scope:
  authority_scope:
    - owner-plan:Vellis-v2-Simplification-Rebaseline
    - model/10-rtg-domain.sysml
    - model/15-everyday-life-starter.sysml
    - model/20-rtg-system.sysml
    - model/30-vellis.sysml
    - model/40-requirements.sysml
    - model/50-verification.sysml
    - AGENTS.md
  implementation_scope:
    - system-evolution.yaml
    - model/
    - vellis/
    - tests/
    - tools/system_evolution.py
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - docs/
    - justfile
    - pyproject.toml
    - uv.lock
  review_lenses: [authority and conformance, engineering and evidence]
  non_goals:
    - Prototype-v2 database or API compatibility.
    - Fuzzy, semantic, embedding, aggregation, dimensional-analysis, or alternative-database features.
    - OAuth, roles, tenants, TLS termination, daemonization, service management, or encryption at rest.
    - Activity pruning, built-in analysis agents, conversation capture, or speculative extension frameworks.
    - Portable implementation-campaign engine redesign.
    - Numerical performance promises without representative owner data and hardware.
findings:
  - id: F001
    summary: Recursive JSON and relationship-rule identities make the RTG larger than the owner problem.
    classification: model gap
    consequence: Agents must reason about nested values and independently identified constraints instead of scalar facts and local type cardinality.
    authority_refs: [owner-plan:sections-2.1-through-2.6]
    evidence_refs: [path:docs/v2-simplification-model-evidence.md#phase-1-conformance-matrix, path:docs/v2-simplification-phase2-evidence.md#implemented-distinction, path:docs/v2-simplification-phase2-evidence.md#focused-evidence]
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: The model renames predecessor concepts while retaining recursive values or participant-rule identities.
    compatibility_effect: The unreleased prototype model and database are intentionally incompatible.
  - id: F002
    summary: Projection, aggregation, and match/get-shaped query behavior exceed the connected bounded questions required.
    classification: model gap
    consequence: The compiler carries a general query language where identity lookup and connected pattern matching suffice.
    authority_refs: [owner-plan:sections-3.3-through-3.6]
    evidence_refs: [path:docs/v2-simplification-model-evidence.md#phase-1-conformance-matrix, path:docs/v2-simplification-phase3-evidence.md#implemented-distinction, path:docs/v2-simplification-phase3-evidence.md#focused-evidence, path:docs/v2-simplification-phase3-evidence.md#subtraction-and-locality-review]
    disposition: implementation-work
    owner_work_item_id: W008
    implementation_status: conflicting
    nearest_wrong_system: A unified tool name hides existing projection, aggregation, hidden-selector, or two-step machinery.
    compatibility_effect: Prototype query requests and results are unsupported.
  - id: F003
    summary: Complete-object updates can discard owner data that an agent did not retrieve.
    classification: model gap
    consequence: A small change requires reconstructing unrelated content and creates a silent-loss footgun.
    authority_refs: [owner-plan:sections-2.8-and-3.7]
    evidence_refs: [path:docs/v2-simplification-model-evidence.md#phase-1-conformance-matrix, path:docs/v2-simplification-phase4-evidence.md#evidence-status]
    disposition: implementation-work
    owner_work_item_id: W008
    implementation_status: conflicting
    nearest_wrong_system: An upsert-shaped adapter still replaces an entire persisted object.
    compatibility_effect: Mutation becomes field-level with explicit removal and no cascade.
  - id: F004
    summary: Proposal versions, status, assessments, and tokens duplicate draft inspection and validation.
    classification: model gap
    consequence: A bucket of deltas acquires an unnecessary public lifecycle and persisted identities.
    authority_refs: [owner-plan:sections-2.9-and-3.8-through-3.12]
    evidence_refs: [path:docs/v2-simplification-model-evidence.md#phase-1-conformance-matrix, path:docs/v2-simplification-phase4-evidence.md#evidence-status]
    disposition: implementation-work
    owner_work_item_id: W008
    implementation_status: conflicting
    nearest_wrong_system: Draft terminology changes while version, stale status, or assessment identity remains.
    compatibility_effect: Prototype proposal and assessment contracts are removed.
  - id: F005
    summary: The shared-connection monolithic store and duplicate definition resolution are correctness hazards.
    classification: implementation defect
    consequence: Temporary populations persist, tests reach private state, and concurrent HTTP operations cannot isolate connections.
    authority_refs: [owner-plan:sections-4.2-through-4.7]
    evidence_refs: [path:docs/v2-simplification-phase2-evidence.md#implemented-distinction, path:docs/v2-simplification-phase2-evidence.md#focused-evidence, path:docs/v2-simplification-phase2-evidence.md#subtraction-and-locality-review]
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: Forwarding classes retain the global store, connection, and duplicate loaders.
    compatibility_effect: Fresh VEL2 storage replaces the unreleased prototype schema without migration.
  - id: F006
    summary: Replay, snapshots, tails, and event-family tables duplicate indexed version history.
    classification: implementation defect
    consequence: Recovery and historical reads carry several state authorities for a local SQLite product.
    authority_refs: [owner-plan:sections-4.10-and-4.11]
    evidence_refs: [path:docs/v2-simplification-phase5-evidence.md#predecessor-reachability-and-subtraction, path:docs/v2-simplification-phase5-evidence.md#evidence-status]
    disposition: implementation-work
    owner_work_item_id: W008
    implementation_status: conflicting
    nearest_wrong_system: Version tables are added while replay remains authoritative or public.
    compatibility_effect: SQLite history, restore, audit, and backup replace snapshot and replay.
  - id: F007
    summary: V1 initialization must preserve legacy meaning without predecessor architecture or whole-graph memory.
    classification: realization decision
    consequence: A naive importer can silently coerce mixed values, lose metadata, or scale with the source graph.
    authority_refs: [owner-plan:section-4.12]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Import succeeds but loses or binary64-rounds values, or materializes the snapshot in memory.
    compatibility_effect: One confirmed v1 JSON snapshot initializes revision zero; v1 storage and history remain unsupported.
  - id: F008
    summary: Private FastMCP hooks, monkeypatching, schema rewriting, and deep client parsing make the boundary fragile.
    classification: implementation defect
    consequence: Dependency changes and concurrent HTTP requests can break behavior outside supported APIs.
    authority_refs: [owner-plan:sections-5.1-through-5.4]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W007
    implementation_status: conflicting
    nearest_wrong_system: Tools work while private server internals or literal client secrets remain in the path.
    compatibility_effect: Only selected CLI commands, STDIO, HTTP, and public client onboarding remain.
  - id: F009
    summary: Evolution validation is overcomplex and tests derive fixtures from the live record.
    classification: plan gap
    consequence: A valid successor can break unrelated tests, while one function mixes schema, invariants, Git, and presentation.
    authority_refs: [AGENTS.md, owner-plan:phase-0]
    evidence_refs: [path:tests/test_system_evolution.py#test_committed_evolution_record_is_valid, path:tests/test_system_evolution.py#test_complete_record_must_be_committed, path:docs/v2-simplification-baseline.md#size-and-complexity, command:uv run pytest tests/test_system_evolution.py, command:just system-evolution-check]
    disposition: resolved
    owner_work_item_id: W000
    implementation_status: conforming
    nearest_wrong_system: The live record passes while synthetic topologies or later record shapes fail unrelated tests.
    compatibility_effect: Evolution meaning remains unchanged while workflow evidence becomes shape independent.
  - id: F010
    summary: Guidance and ordinary checks preserve completed-campaign and predecessor capability claims.
    classification: stale baseline
    consequence: Contributors are directed toward replay, assessments, aliases, and a completed campaign gate after removal.
    authority_refs: [owner-plan:phase-8, AGENTS.md]
    evidence_refs: []
    disposition: implementation-work
    owner_work_item_id: W008
    implementation_status: conflicting
    nearest_wrong_system: Runtime subtraction completes while public claims or ordinary gates still preserve the old system.
    compatibility_effect: Documentation and checks will describe only simplified runnable v2.
decisions:
  - id: D000
    summary: Keep evolution checks layered and synthetic instead of live-record-shaped.
    authority_refs: [AGENTS.md, owner-plan:phase-0]
    alternatives: [Retain one monolithic validator., Use the live evolution as every test fixture.]
    reversible: true
    owner_work_item_id: W000
    evidence_intent: [Synthetic records exercise invariants., One explicit test validates the committed record., Pure checks run without Git.]
    implementation_status: conforming
    evidence_refs: [path:tests/test_system_evolution.py#test_pure_invariants_do_not_consult_git_or_repository_state, path:tests/test_system_evolution.py#test_schema_requires_work_and_at_least_one_finding_or_decision, path:tests/test_system_evolution.py#test_an_accepted_approval_binds_and_seals_owned_meaning, path:tests/test_system_evolution.py#test_evolution_approval_allows_later_not_required_internal_decision, path:docs/v2-simplification-baseline.md#portable-forward-test-disposition, command:just skills-check, command:just lint, command:just typecheck]
  - id: D001
    summary: Use scalar values and local cardinality.
    authority_refs: [owner-plan:section-2]
    alternatives: [Retain recursive JSON., Retain relationship rules., Retain versioned proposals and assessments.]
    reversible: false
    owner_work_item_id: W002
    evidence_intent: [The implementation distinguishes scalar kinds and enforces local bounds without relationship-rule identities.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_domain_v2.py#test_definition_references_and_complete_graph_cardinality_are_validated, path:tests/vellis/test_domain_v2.py#test_all_four_local_cardinality_roles_cover_exact_minimum_maximum_and_unbounded, path:tests/vellis/test_storage_v2.py#test_scalar_versions_round_trip_null_and_all_nonnull_kinds, path:docs/v2-simplification-phase2-evidence.md#focused-evidence]
  - id: D002
    summary: Expose one query with identity and connected-pattern selections and post-bound hydration.
    authority_refs: [owner-plan:section-3]
    alternatives: [Separate match and get., Retain projection and aggregation.]
    reversible: false
    owner_work_item_id: W003
    evidence_intent: [Evidence rejects hidden selectors, disconnected products, and hydration before bounding.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_query_v2_successor.py#test_identity_selection_reports_missing_and_hydrates_only_requested_fields, path:tests/vellis/test_query_v2_successor.py#test_connected_patterns_bind_every_selector_and_enforce_whole_result_bound, path:docs/v2-simplification-phase3-evidence.md#focused-evidence]
  - id: D003
    summary: Use immutable domain values, SQLite functions, operation functions, and thin adapters.
    authority_refs: [owner-plan:sections-4.2-through-4.7]
    alternatives: [Forwarding service classes., ORM interfaces., Global store.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [One connection per operation., One definition resolver., No framework imports in domain.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_storage_v2.py#test_current_resolution_and_reads_do_not_traverse_canonical_history, path:tests/vellis/test_storage_v2.py#test_failure_after_temporary_creation_publishes_nothing, path:docs/v2-simplification-phase2-evidence.md#subtraction-and-locality-review]
  - id: D004
    summary: Compile flat bounded queries to parameterized SQL CTEs with version-aware FTS and an independent oracle.
    authority_refs: [owner-plan:section-4.8]
    alternatives: [General query AST., In-memory graph evaluation.]
    reversible: true
    owner_work_item_id: W003
    evidence_intent: [Topology oracle catches selector and join mutations., Limit-plus-one precedes hydration., Historical search respects intervals.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_query_v2_successor.py#test_sql_topology_matches_independent_oracle_and_catches_distinctness_mutant, path:tests/vellis/test_query_v2_successor.py#test_bound_is_checked_before_hydration, path:tests/vellis/test_query_v2_successor.py#test_historical_query_uses_selected_intervals_for_graph_and_search, path:docs/v2-simplification-phase3-evidence.md#subtraction-and-locality-review]
  - id: D005
    summary: Store one normalized draft patch per key and opaque continuations with internal fingerprints.
    authority_refs: [owner-plan:section-4.9]
    alternatives: [Draft edit log., Public draft version., Generic cursor subsystem.]
    reversible: true
    owner_work_item_id: W004
    evidence_intent: [Live writes preserve unstaged fields., Cursors expire correctly., Activation revalidates.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_change_draft_v2.py#test_draft_fields_win_while_unstaged_live_fields_follow_live, path:tests/vellis/test_change_draft_v2.py#test_inspection_pages_and_expires_on_live_or_draft_change, path:tests/vellis/test_change_draft_v2.py#test_activation_revalidates_invalid_valid_and_redundant_drafts, path:docs/v2-simplification-phase4-evidence.md#evidence-status]
  - id: D010
    summary: Use field-level graph patches and one unversioned durable draft.
    authority_refs: [owner-plan:sections-2.8-through-2.9]
    alternatives: [Use complete-object replacement., Retain proposal versions and assessment identities.]
    reversible: false
    owner_work_item_id: W004
    evidence_intent: [One-field changes preserve unseen data., Draft overlay follows live fields without public version or assessment identity.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_change_draft_v2.py#test_field_patches_preserve_unmentioned_content_and_distinguish_null, path:tests/vellis/test_change_draft_v2.py#test_draft_only_addition_has_no_system_until_activation, path:tests/vellis/test_change_draft_v2.py#test_repeated_draft_edits_merge_tombstone_restart_and_unstage, path:docs/v2-simplification-phase4-evidence.md#evidence-status]
  - id: D006
    summary: Use version intervals, a canonical hash chain, separate activity, SQL restore, and online backup.
    authority_refs: [owner-plan:sections-4.5-and-4.10-through-4.11]
    alternatives: [Replay history., Public snapshots and tails., Activity hash chain.]
    reversible: false
    owner_work_item_id: W005
    evidence_intent: [Reads do not replay., Audit detects corruption., Backup works while serving and excludes sidecars.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_history_recovery_v2.py#test_history_is_complete_bounded_ordered_and_excludes_its_own_activity, path:tests/vellis/test_history_recovery_v2.py#test_restore_revision_preserves_lineage_metadata_and_intervening_history, path:tests/vellis/test_history_recovery_v2.py#test_read_only_audit_detects_independent_relation_corruption, path:tests/vellis/test_history_recovery_v2.py#test_online_backup_and_initialization_preserve_complete_database_only, path:docs/v2-simplification-phase5-evidence.md#evidence-status]
  - id: D007
    summary: Stream v1 JSON through staging SQLite and report every disposition before publication.
    authority_refs: [owner-plan:section-4.12]
    alternatives: [Whole-document load., In-place conversion., Silent coercion.]
    reversible: true
    owner_work_item_id: W006
    evidence_intent: [Import memory is bounded., Mixed values become exact JSON text., Digests bind confirmation.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D008
    summary: Pin selected stable dependencies and use public FastMCP and client CLI boundaries only.
    authority_refs: [owner-plan:sections-4.1-and-5]
    alternatives: [Beta private hooks., Direct config edits., Literal tokens in arguments.]
    reversible: true
    owner_work_item_id: W007
    evidence_intent: [Installed STDIO and HTTP work., Requests isolate connections., Registration exposes no token.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D009
    summary: Delete predecessor machinery and synchronize every public and contributor claim.
    authority_refs: [owner-plan:phase-8]
    alternatives: [Leave compatibility residue., Keep completed campaign validation in ordinary checks.]
    reversible: true
    owner_work_item_id: W008
    evidence_intent: [Complexity decreases., Full gates and black-box scenarios pass., Cold reconstruction finds no obsolete path.]
    implementation_status: not evaluated
    evidence_refs: []
