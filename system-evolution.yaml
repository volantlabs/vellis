findings:
  - id: F001
    summary: Materialized intermediate binding CTEs can grow with all partial matches despite a small maximumMatches.
    classification: implementation defect
    consequence: A bounded public query can consume temporary storage and work proportional to every partial binding before the final maximum-plus-one limit is observed.
    authority_refs: [VellisRequirements::querySafety, VellisRequirements::locality]
    evidence_refs: [path:tests/vellis/test_query_v2_successor.py#test_dense_pattern_stops_stream_after_maximum_plus_one_complete_bindings]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A two-node pattern with maximumMatches one materializes every matching node pair before detecting the second complete tuple.
    compatibility_effect: Accepted and rejected query results remain unchanged; only evaluation resource shape changes.
  - id: F002
    summary: Client entry enumeration treats every nonzero public CLI result as an absent entry.
    classification: implementation defect
    consequence: Malformed or unreadable external client configuration can be followed by an attempted add instead of a safe stop on uncertain state.
    authority_refs: [Vellis::'Connect trusted MCP agent', VellisRequirements::mcpBoundary, VellisRequirements::simpleOperation, VellisVerification::mcpLifecycle]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_client_enumeration_distinguishes_absence_from_uncertain_failure]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A failed configuration parse and a documented missing-entry result both return false from entry enumeration.
    compatibility_effect: Documented missing entries still register; other enumeration failures now stop before mutation.
  - id: F003
    summary: Escaped lone surrogates pass strict wire decoding and fail later during canonical UTF-8 encoding.
    classification: implementation defect
    consequence: Malformed public text becomes an unexpected execution failure rather than an invalid-arguments rejection with no state effect.
    authority_refs: [VellisRequirements::mcpBoundary]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_non_utf8_unicode_surrogate_is_invalid_arguments_without_activity, path:tests/vellis/test_mcp_lifecycle_v2.py#test_top_level_text_surrogates_reject_before_domain_operation]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A lone surrogate in a nested object or top-level type-key collection reaches a domain operation and raises UnicodeEncodeError during publication or SQLite lookup.
    compatibility_effect: Unicode scalar text remains accepted; only strings that cannot be encoded as UTF-8 are rejected at the wire boundary.
  - id: F004
    summary: Audit rejects inverted version intervals but not overlapping intervals for one version-family identity.
    classification: implementation defect
    consequence: A self-consistent but ambiguous historical lineage can pass audit, backup, and restore validation.
    authority_refs: [VellisRequirements::lifecycle]
    evidence_refs: [path:tests/vellis/test_history_recovery_v2.py#test_audit_detects_overlapping_versions_with_individually_valid_intervals]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Two individually valid versions of one identity overlap at a revision and audit reports no interval finding.
    compatibility_effect: Valid databases remain unchanged; semantically ambiguous version histories are newly rejected by audit.
  - id: F005
    summary: FTS audit compares aggregate vocabulary but not document identity and token position.
    classification: implementation defect
    consequence: Search index corruption that changes phrase results can pass audit and backup validation.
    authority_refs: [VellisRequirements::lifecycle, VellisRequirements::queryPredicates]
    evidence_refs: [path:tests/vellis/test_history_recovery_v2.py#test_audit_detects_phrase_changing_fts_token_position_corruption]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Reversing two indexed tokens preserves aggregate counts while reversing which phrase query matches.
    compatibility_effect: Search behavior and schema remain unchanged; audit becomes sensitive to per-document token positions.
  - id: F006
    summary: Closure evidence retained an obsolete complete-suite test count.
    classification: stale baseline
    consequence: A reviewer cannot distinguish the current verified candidate from an earlier test inventory using the gate table.
    authority_refs: [VellisVerification::'Predicates Search And Bounds Are Exact', VellisVerification::lifecycle, VellisVerification::mcpLifecycle]
    evidence_refs: [path:docs/v2-pre-release-evidence.md#verification, command:just check]
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: The narrative summary reports the current gate while its verification table preserves the superseded 798-test result.
    compatibility_effect: No product effect; closure evidence now reports one reproducible complete-suite result.
decisions:
  - id: D001
    summary: Stream pattern bindings with bounded depth-first candidate cursors and retain only maximum plus one complete tuples.
    authority_refs: [VellisRequirements::querySafety, VellisRequirements::locality]
    alternatives: [Retain unbounded materialized CTEs., Limit incomplete prefixes and risk losing valid completions., Build a second in-memory graph query engine.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [A dense pattern stops after maximum plus one complete tuples., One maximum-width pattern returns its exact 1,000 bindings and an unfiltered second match rejects., A relationship is checked as soon as its endpoints bind., Patterns above the SQLite flat-join limit remain supported., Public query meaning remains identical to the independent topology oracle.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_query_v2_successor.py#test_dense_pattern_stops_stream_after_maximum_plus_one_complete_bindings, path:tests/vellis/test_query_v2_successor.py#test_streamed_pattern_above_sqlites_flat_join_limit_is_a_domain_result, path:tests/vellis/test_query_v2_successor.py#test_maximum_width_parallel_links_match_and_overflow_without_sqlite_limits, path:tests/vellis/test_query_v2_successor.py#test_streamed_pattern_checks_bound_relationship_before_opening_later_node]
  - id: D002
    summary: Recognize only each supported public client's positive missing-entry diagnostic as absence.
    authority_refs: [Vellis::'Connect trusted MCP agent', VellisRequirements::mcpBoundary, VellisRequirements::simpleOperation, VellisVerification::mcpLifecycle]
    alternatives: [Treat every nonzero result as absence., Parse private client configuration., Add a client-adapter framework.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [Codex and Claude documented absence diagnostics return false., Other nonzero results raise before remove or add.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_client_enumeration_distinguishes_absence_from_uncertain_failure]
  - id: D003
    summary: Compare expected and actual FTS vocabularies at instance granularity including document column and offset.
    authority_refs: [VellisRequirements::lifecycle]
    alternatives: [Retain aggregate row vocabulary., Rebuild and mutate the live index during audit., Add a second search representation.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [Phrase-changing token-order corruption is detected., A valid independently rebuilt index remains equivalent.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_history_recovery_v2.py#test_audit_detects_phrase_changing_fts_token_position_corruption]
