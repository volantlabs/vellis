schema_version: "1.0"
evolution:
  id: vellis-2-pre-release-closure-corrections
  objective: Close bounded pre-release diagnostic, simplicity, evidence, and authority findings without reopening the v2 design.
  observable_distinction: Agents receive repairable exact finding paths, every public bound has one authority, and release evidence discriminates the remaining plausible wrong systems without new product machinery.
  lifecycle: awaiting-approval
  approval:
    status: pending
    reason: The owner-approved closure plan changes starter-count and finding-location authority before implementation proceeds.
    checkpoint: null
  blocker: null
  checkpoint: null
baselines:
  status: current
  source: &source
    model: sha256:8af0ac5250d5186b8baa693bc8ebcc2b5e69f0e130754fbc676cb2302bfa8794
    implementation: git:7d007fd0b7e2ac6e8671bc297400f1490dd03a62
    language: sha256:054aab62276a55c43860e3d2daad5fae864db550b3a58ab110074f8b293996ff
    execution_environment: sha256:a486c22174806217cbf30c4c5b2a088421e4e9c5633fd507506e3711c88b57b8
    checkpoint: git:7d007fd0b7e2ac6e8671bc297400f1490dd03a62
  target: null
  observed: *source
scope:
  authority_scope:
    - owner-plan:Vellis-v2-Pre-release-Closure-Correction-Plan
    - owner-plan:Vellis-v2-Simplification-Rebaseline
    - RTG::'Validation Finding'
    - RTGSystem::'Validate current or draft state'
    - EverydayLifeStarter::'Everyday Life Starter Definition Set'
    - VellisRequirements::mcpBoundary
    - VellisRequirements::starter
    - VellisVerification::'Inspect Validate Activate And Discard Draft'
    - VellisVerification::'Starter Is Small Typed And Optional'
  implementation_scope:
    - system-evolution.yaml
    - model/
    - vellis/
    - tests/
    - docs/v2-simplification-phase8-evidence.md
    - docs/v2-pre-release-evidence.md
    - justfile
  review_lenses: [authority and conformance, engineering and evidence]
  non_goals:
    - No new public operation, error code, finding field, configuration, migration framework, schema relation, or compatibility layer.
    - No full predicate oracle or alternate query engine.
    - No effective-definition helper or resolver refactor.
    - No portable campaign-engine redesign or C901 cleanup in tooling or tests.
    - No retroactive Git-history rewrite or generic deletion-sequencing framework.
    - No arbitrary module, table, line, or test-count reduction.
    - No protected .data inspection.
findings:
  - id: F001
    summary: Exact top-level starter multiplicities contradict the accepted completeness decision.
    classification: model gap
    consequence: Redundant totals freeze an inventory already established by named modeled definitions and make intentional vocabulary evolution unnecessarily contradictory.
    authority_refs: [EverydayLifeStarter::'Everyday Life Starter Definition Set', VellisRequirements::starter, VellisVerification::'Starter Is Small Typed And Optional']
    evidence_refs: [path:docs/v2-simplification-model-evidence.md#phase-1-conformance-matrix, path:tests/vellis/test_storage_v2.py#test_starter_has_exact_small_typed_vocabulary_and_no_graph]
    disposition: model-change
    owner_work_item_id: W001
    implementation_status: conflicting
    nearest_wrong_system: The named starter remains complete but authority rejects it solely because a redundant aggregate count changed.
    compatibility_effect: Runtime starter content remains semantically unchanged.
  - id: F002
    summary: Finding authority does not state repairable subject and location semantics.
    classification: model gap
    consequence: Several affected subjects may legally collapse to one positional path, forcing an agent to rediscover which dependent needs repair.
    authority_refs: [RTG::'Validation Finding', VellisRequirements::mcpBoundary, VellisVerification::'Inspect Validate Activate And Discard Draft']
    evidence_refs: [path:docs/v2-simplification-phase4-evidence.md#evidence-status, path:tests/vellis/test_domain_v2.py#test_dynamic_domain_finding_paths_are_rfc6901_pointers]
    disposition: model-change
    owner_work_item_id: W001
    implementation_status: conflicting
    nearest_wrong_system: Findings name a missing referent but not the independently repairable request member or affected-state subject.
    compatibility_effect: Existing fields and finding codes remain; only path precision is strengthened.
  - id: F003
    summary: Effective validation collapses every definition subject to definitions index zero.
    classification: implementation defect
    consequence: A cold agent cannot identify which definitions depend on one removed key.
    authority_refs: [RTG::'Validation Finding', VellisRequirements::mcpBoundary]
    evidence_refs: [path:docs/v2-simplification-phase4-evidence.md#implemented-distinction]
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Several dependent definitions produce indistinguishable positional paths while retaining only the missing referent identity.
    compatibility_effect: Findings become more precise without a wire-shape change.
  - id: F004
    summary: Duplicate, root, and property-predicate paths do not resolve to request locations.
    classification: implementation defect
    consequence: Programmatic repair cannot resolve double-slash, synthetic-parent, or non-member paths against the original request.
    authority_refs: [RTG::'Validation Finding', VellisRequirements::mcpBoundary]
    evidence_refs: [path:tests/vellis/test_domain_v2.py#test_dynamic_domain_finding_paths_are_rfc6901_pointers]
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Behavior rejects correctly but returns a path that is syntactically or referentially unusable.
    compatibility_effect: Only diagnostic paths change.
  - id: F005
    summary: The one public item limit is defined and rendered in multiple production locations.
    classification: implementation defect
    consequence: A single edit can make public schemas, validation, storage constraints, and summaries disagree.
    authority_refs: [VellisRequirements::mcpBoundary]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#subtraction-measurements]
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: One enforcement site silently accepts or advertises a different maximum from the rest.
    compatibility_effect: The public value remains 1000 and database schema/version remain unchanged.
  - id: F006
    summary: Predicate evidence lacks a direct plausible-mutant discriminator.
    classification: plan gap
    consequence: The operator matrix lacks one explicit demonstration that strict and inclusive numeric comparisons produce different public results.
    authority_refs: [VellisVerification::'Predicates Search And Bounds Are Exact']
    evidence_refs: [path:tests/vellis/test_query_v2_successor.py#test_sql_topology_matches_independent_oracle_and_catches_distinctness_mutant]
    disposition: plan-change
    owner_work_item_id: W002
    implementation_status: partial
    nearest_wrong_system: A strict numeric boundary is compiled inclusively while ordinary expected-value cases fail to expose it.
    compatibility_effect: No product behavior changes; evidence becomes discriminating.
  - id: F007
    summary: Production deletion was historically deferred to the final subtraction phase.
    classification: plan gap
    consequence: Intermediate checkpoints carried predecessor and successor implementations together, weakening phase-local simplicity review.
    authority_refs: [owner-plan:Vellis-v2-Simplification-Rebaseline]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#subtraction-measurements]
    disposition: accepted
    owner_work_item_id: W003
    implementation_status: not applicable
    nearest_wrong_system: A future campaign again treats phase-local deletion as optional prose and reviews duplicate runtime paths.
    compatibility_effect: Historical Git state is retained unchanged.
  - id: F008
    summary: Phase 8 labels a vellis plus tools C901 count as repository-wide.
    classification: stale baseline
    consequence: The evidence label implies tests were included when its reproduction command excludes them.
    authority_refs: [owner-plan:Vellis-v2-Simplification-Rebaseline]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#final-gates]
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Readers infer no additional test complexity findings exist from a narrower measurement.
    compatibility_effect: Documentation only.
  - id: F009
    summary: v1_pointer.py is a forwarding-only production module.
    classification: realization decision
    consequence: A five-line alias adds an independent module without independent meaning.
    authority_refs: [owner-plan:Vellis-v2-Pre-release-Closure-Correction-Plan]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#intended-deletion-and-boundary-inventory]
    disposition: implementation-work
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: The alias survives or is replaced by another forwarding layer.
    compatibility_effect: Private imports move directly; public behavior is unchanged.
  - id: F010
    summary: Product C901 at most 10 is measured but absent from ordinary just check.
    classification: plan gap
    consequence: A durable simplicity constraint can regress while the ordinary project gate remains green.
    authority_refs: [owner-plan:Vellis-v2-Simplification-Rebaseline]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#final-gates]
    disposition: plan-change
    owner_work_item_id: W002
    implementation_status: partial
    nearest_wrong_system: A production complexity regression lands because only an ad hoc closure command detects it.
    compatibility_effect: Developer gate only.
  - id: F011
    summary: Effective-definition composition repeats as small explicit glue.
    classification: realization decision
    consequence: Extracting it could create another resolver or authority; retaining it leaves several obvious call-site compositions.
    authority_refs: [owner-plan:Vellis-v2-Pre-release-Closure-Correction-Plan]
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#subtraction-measurements]
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: Cleanup creates a second definition-resolution abstraction or mutable cache.
    compatibility_effect: No change.
decisions:
  - id: D001
    summary: Encode definition subjects in keyed paths while retaining missing or conflicting referents in typeKeys.
    authority_refs: [RTG::'Validation Finding', VellisRequirements::mcpBoundary]
    alternatives: [Add a finding field., Repurpose typeKeys first entry as the subject., Retain positional definition paths.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Multiple dependents are independently repairable., Dynamic type-key segments obey RFC 6901., V1 provenance retains missing-referent identity.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D002
    summary: Keep vellis.domain.PUBLIC_ITEM_LIMIT as the sole Python authority and render SQLite from it.
    authority_refs: [VellisRequirements::mcpBoundary]
    alternatives: [Add configuration., Add a limits module., Retain copied constants and literals.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Schemas and 1000 and 1001 boundaries agree., Rendered schema and database version remain unchanged.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D003
    summary: Keep the independent oracle topology-only and add one behavior-level predicate mutant discriminator.
    authority_refs: [VellisVerification::'Predicates Search And Bounds Are Exact']
    alternatives: [Build a second predicate engine., Monkeypatch a private compiler helper., Rely only on hand-written expectations.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [A strict numeric result differs from a locally computed inclusive mutant and matches the public query.]
    implementation_status: not evaluated
    evidence_refs: []
  - id: D004
    summary: Retain repeated effective-definition composition as explicit glue.
    authority_refs: [owner-plan:Vellis-v2-Pre-release-Closure-Correction-Plan]
    alternatives: [Add another resolver helper., Add a repository facade.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Exactly one canonical definition resolver remains and composition stays local and stateless.]
    implementation_status: conforming
    evidence_refs: [path:docs/v2-simplification-phase8-evidence.md#subtraction-measurements]
  - id: D005
    summary: Preserve historical deletion evidence without Git rewriting or new process-gate tooling.
    authority_refs: [owner-plan:Vellis-v2-Pre-release-Closure-Correction-Plan]
    alternatives: [Rewrite history., Add a generic campaign mechanism., Record the operational lesson only.]
    reversible: true
    owner_work_item_id: W003
    evidence_intent: [The final narrative names the deviation and future checkpoint lesson without changing history or portable tooling.]
    implementation_status: not evaluated
    evidence_refs: []
