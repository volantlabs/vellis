schema_version: "1.0"
evolution:
  id: post-build-resource-and-evolution-review
  objective: Reconcile post-build resource-behavior findings and establish a portable model-and-implementation evolution workflow.
  observable_distinction: Live state is durably addressable without a resident whole graph, bounded reads stop at the caller bound, indexed identity joins constrain current queries before value filtering, and every change remains traceable to accepted authority.
  lifecycle: active
  approval:
    status: accepted
    reason: The owner accepted the strengthened resource behavior and selected SQLite-owned live state with no unreleased-format compatibility obligation.
    checkpoint: git:284efc9
  blocker: null
  checkpoint: null
