evolution:
  id: sqlite-write-path-resource-review
  objective: Correct facet-only SQLite write work and decide whether ordinary graph mutation must avoid complete-graph materialization.
  observable_distinction: A definition-only no-op or delta discard reads and writes no graph objects, transition commits validate their actual stored representation, and any stronger mutation bound is accepted before implementation relies on it.
  lifecycle: awaiting-approval
  approval:
    status: pending
    reason: Strengthening ordinary graph-mutation resource behavior beyond the current complete-graph validation exception requires owner acceptance; independent implementation defects do not.
    checkpoint: null
  blocker: null
  checkpoint: null
