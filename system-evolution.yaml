schema_version: "1.0"
evolution:
  id: streamed-reconstruction-transition-validity
  objective: Reject any native snapshot tail whose individual canonical transitions do not reconstruct the exact valid state they claim while preserving bounded-memory replay and first-use v1 recovery behavior.
  observable_distinction: A self-consistent tail with an invalid intermediate active graph or mismatched prospective-definition identity is refused even when a later record restores a valid final state.
  lifecycle: complete
  approval:
    status: not-required
    reason: Accepted replay and canonical-history authority already requires every transition to be semantically valid and replay-equivalent.
    checkpoint: null
  blocker: null
  checkpoint: git:8ff7aef4e5ed953b16edde5fd1eab0ae87e11446
