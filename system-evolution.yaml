  non_goals:
    - Add disconnected or cyclic patterns, traversal, OR, negation, sorting, paging, grouping, mixed output, multiple aggregate targets, a parser, optimizer, fallback evaluator, or rule engine.
    - Change persistent schema, snapshots, replay, restore, v1 initialization, tool names, approval, or canonical transactions.
    - Add numerical budgets or touch ignored owner data, external clients, releases, tags, merges, or pull-request state.
findings:
  - {id: F001, summary: "The query model permits disconnected components, cycles, and mixed output without an owner use case.", classification: model gap, consequence: "Unneeded generality legitimizes component products and ambiguous outputs.", authority_refs: [RTG::'Graph Query', VellisRequirements::querySafety], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: model-change, owner_work_item_id: W001, implementation_status: conflicting, nearest_wrong_system: "One join is patched while the language retains forms requiring the same accidental machinery.", compatibility_effect: "Disconnected, cyclic, and mixed requests are removed."}
  - {id: F002, summary: "Property-only projection collapses distinct source objects carrying equal values.", classification: model gap, consequence: "Rows cannot preserve object cardinality safely.", authority_refs: [RTG::'Returned Property', VellisRequirements::semanticQueryMeaning], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: model-change, owner_work_item_id: W001, implementation_status: conflicting, nearest_wrong_system: "Equal values remain indistinguishable when their source objects differ.", compatibility_effect: "Property row identity includes its source data UUID."}
  - {id: F003, summary: "Flat SQLite joins multiply hidden witnesses before late deduplication.", classification: implementation defect, consequence: "Work grows with combinations that cannot distinguish an answer.", authority_refs: [VellisRequirements::querySafety], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W003, implementation_status: conflicting, nearest_wrong_system: "SELECT DISTINCT acts only after hidden witness products.", compatibility_effect: "Connected-tree answers remain while hidden branches become existential."}
  - {id: F004, summary: "The test oracle imports a second production assignment evaluator.", classification: plan gap, consequence: "Differential tests cannot expose shared semantic defects.", authority_refs: [VellisVerification::semanticQuery], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W003, implementation_status: conflicting, nearest_wrong_system: "Named realizations agree because they share production semantics.", compatibility_effect: "No capability is lost; fallback evaluation is deleted."}
  - {id: F005, summary: "State selection uses parallel fields and arguments plus legacy middleware.", classification: model gap, consequence: "Equivalent meaning has invalid combinations and compatibility branches.", authority_refs: [RTG::'Graph Query', VellisRequirements::historicalStateCorrectness], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: model-change, owner_work_item_id: W001, implementation_status: conflicting, nearest_wrong_system: "A tagged selector is added while old selector channels remain.", compatibility_effect: "One tagged state replaces prerelease overloads without translation."}
  - {id: F006, summary: "Authority does not exclude far-end promotion and participant-by-rule work precisely enough.", classification: model gap, consequence: "Correct findings can still use forbidden quadratic neighborhoods.", authority_refs: [VellisRequirements::explicitGraphChangeSet], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: model-change, owner_work_item_id: W001, implementation_status: conflicting, nearest_wrong_system: "Every incident endpoint is affected even when its count cannot change.", compatibility_effect: "Findings remain complete; lookup-only identities stay unpromoted."}
  - {id: F007, summary: "Active endpoint-type changes expand a quadratic incident neighborhood.", classification: implementation defect, consequence: "Hub-of-hubs work grows quadratically.", authority_refs: [VellisRequirements::explicitGraphChangeSet], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W004, implementation_status: conflicting, nearest_wrong_system: "Active validation promotes both endpoints of every incident relationship.", compatibility_effect: "Active validity and atomic rejection remain unchanged."}
  - {id: F008, summary: "Prospective multiplicity selection is reason-insensitive.", classification: implementation defect, consequence: "Display edits scale with irrelevant rules and independent changes form cross-products.", authority_refs: [VellisRequirements::validationCoverage], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W004, implementation_status: conflicting, nearest_wrong_system: "Mentioned types select all rules and all changed participants enter each rule.", compatibility_effect: "Prospective findings and activation remain complete."}
  - {id: F009, summary: "Historical aggregation preflight omits a compiled LIMIT binding.", classification: implementation defect, consequence: "A boundary query passes preflight then fails with too many variables.", authority_refs: [VellisRequirements::querySafety], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W003, implementation_status: conflicting, nearest_wrong_system: "Capacity is estimated from fields rather than executable statements.", compatibility_effect: "Excess receives typed whole-result refusal."}
  - {id: F010, summary: "Permitted-value uniqueness compares each value with every earlier value.", classification: implementation defect, consequence: "Valid definition work grows quadratically.", authority_refs: [VellisRequirements::canonicalSemanticEquality], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W002, implementation_status: conflicting, nearest_wrong_system: "Equality is correct but uniqueness remains pairwise.", compatibility_effect: "JSON meaning and persisted identities remain unchanged."}
  - {id: F011, summary: "Documentation claims scaling properties disproved by current evidence.", classification: stale baseline, consequence: "Public guidance overstates conformance.", authority_refs: [path:README.md#implementation-status], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: implementation-work, owner_work_item_id: W005, implementation_status: conflicting, nearest_wrong_system: "Prior remediation remains documented as complete.", compatibility_effect: "Guidance distinguishes proposed, implemented, and verified states."}
decisions:
  - {id: D001, summary: "Public graph queries are connected acyclic selector trees.", authority_refs: [RTG::'Graph Query'], alternatives: [Retain disconnected or cyclic forms.], reversible: false, owner_work_item_id: W001, evidence_intent: [Reject disconnected and cyclic graphs., Accept paths, stars, and trees.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D002, summary: "Row and aggregate output are exclusive with no grouping.", authority_refs: [RTG::'Query Output'], alternatives: [Retain mixed output.], reversible: false, owner_work_item_id: W001, evidence_intent: [Reject mixed output., Preserve one-target arithmetic.], implementation_status: not evaluated, evidence_refs: []}
