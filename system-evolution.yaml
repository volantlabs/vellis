schema_version: "1.0"
evolution:
  id: vellis-2-distribution-install-fix
  objective: Give Vellis a working, guarded git-hosted install path so the documented onboarding command actually installs the tool and stays truthful over time.
  observable_distinction: The documented `uv tool install git+...` command installs and runs correctly, an automated check derived from README.md fails when that command or its required Install heading drifts, and package_smoke's expected version no longer risks silent drift from pyproject.toml.
  lifecycle: active
  approval:
    status: not-required
    reason: model/50-verification.sysml already requires proving the MCP boundary from installed wheel and source distribution; this closes an evidence and realization gap under that existing acceptance, and the owner selected the git+ distribution channel directly.
    checkpoint: null
  blocker: null
  checkpoint: git:6dbe5b0841f099686c7dbb37b5e83eb0a488c074
