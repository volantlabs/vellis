scope:
  authority_scope: []
  implementation_scope:
  - pyproject.toml
  - uv.lock
  - system-evolution.yaml
  review_lenses:
  - authority and conformance
  - engineering and evidence
  non_goals:
  - No model authority, product runtime dependency, package, wire, or database change.
  - No change to tools/sysml_reference.py or to the generated corpus format.
  - No workaround that post-processes extracted text to restore the 6.19 spacing.
findings:
- id: F001
  summary: The locked pypdf 6.16.1 lies inside the vulnerable range of 26 of the 29 open Dependabot advisories,
    and the previous floor of 6.15.0 admitted all 29.
  classification: realization decision
  consequence: Every advisory is a denial-of-service class defect on malformed PDF input, fixed between 6.16.0 and
    6.21.4. pypdf is a development dependency used only by the specification reference tool, which reads checksum-pinned
    official PDFs, so exposure is low, but the alerts stay open until the lock leaves every vulnerable range. The
    model leaves the toolchain version open, so this is a selection rather than a defect under authority.
  authority_refs: []
  evidence_refs:
  - command:just system-evolution-check
  disposition: resolved
  owner_work_item_id: W001
- id: F002
  summary: No patched pypdf preserves the 6.19.0 layout-mode spacing; from 6.20.0 on, a few word boundaries at text
    style changes are dropped.
  classification: feasibility consequence
  consequence: Rendering the 1158-page SysML 2.1 and KerML 1.1 corpus with 6.16.1 and with 7.0.1 changed 129 pages.
    115 differ only in within-line spacing, mostly diagram columns. Five lose spurious spaces around registered-trademark
    signs. Nine lose about fifteen real word boundaries, such as inClause, aPartsTreeView and outfuel:, mostly in
    the vehicle example annex. Page count, outline and extraction-warning pages are unchanged, and 6.21.4 renders
    byte-identically to 7.0.1. A per-release probe places the change at 6.20.0. The owner accepted the trade-off
    in exchange for leaving the advisory ranges.
  authority_refs: []
  evidence_refs:
  - command:just model-reference-check
  disposition: accepted
  owner_work_item_id: W001
- id: F003
  summary: The corpus check does not notice a corpus rendered by a different pypdf, so an existing cache keeps the
    superseded extraction after this bump.
  classification: out of scope
  consequence: model-reference-check compares the language lock digest, the generator version and per-file digests,
    but not the extractor version, so a corpus rendered under 6.16.1 still passes after the lock moves to 7.0.1.
    The difference is limited to the F002 consequences and a just model-setup refreshes it. Recording the extractor
    identity in the manifest is a separate tooling change outside this objective.
  authority_refs: []
  evidence_refs:
  - command:just model-reference-check
  disposition: out-of-scope
  owner_work_item_id: W001
decisions:
- id: D001
  summary: Raise the floor to pypdf>=6.21.4 without an upper bound, which locks 7.0.1.
  authority_refs: []
  alternatives:
  - Cap below 7 and lock 6.21.4, which renders a byte-identical corpus and only defers the next major-version alert.
  - Keep 6.16.1 or 6.19.0 for their spacing, which leaves high-severity advisories open.
  - Post-process extracted text to reinsert word boundaries, which adds a heuristic the reference tool would have
    to own.
  reversible: true
  owner_work_item_id: W001
  implementation_status: conforming
  evidence_refs:
  - command:just system-evolution-check
  - command:uv run pytest tests/test_sysml_reference.py
work_items:
- id: W001
  label: Move pypdf out of the advisory ranges and record the extraction consequence
  kind: implementation
  dependencies: []
  finding_ids:
