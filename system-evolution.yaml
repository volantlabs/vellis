  - {id: D004, summary: "Hidden selector branches affect answers only through existence.", authority_refs: [VellisRequirements::querySafety], alternatives: [Flat joins and late distinct.], reversible: true, owner_work_item_id: W003, evidence_intent: [Hidden fanout does not multiply answers or decodes.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D005, summary: "Collection query restrictions use one relational member mechanism.", authority_refs: [VellisRequirements::querySafety], alternatives: [Threshold-specific filter paths.], reversible: true, owner_work_item_id: W003, evidence_intent: [Large filters ignore host-variable thresholds.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D006, summary: "Query and discovery carry one tagged evaluated-state selection.", authority_refs: [RTG::'Evaluated State Selection'], alternatives: [Scope plus optional history.], reversible: false, owner_work_item_id: W001, evidence_intent: [Exercise four selection kinds.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D007, summary: "JSON equality uses one immutable kind-tagged key for sets and counters.", authority_refs: [VellisRequirements::canonicalSemanticEquality], alternatives: [Pairwise scans., Serialization identity.], reversible: true, owner_work_item_id: W002, evidence_intent: [Preserve numeric equivalence and Boolean distinction with one key construction per value and no pairwise uniqueness scan.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D008, summary: "Active and prospective multiplicity share one old/proposed reason kernel.", authority_refs: [VellisRequirements::explicitGraphChangeSet], alternatives: [Separate broad algorithms.], reversible: true, owner_work_item_id: W004, evidence_intent: [Exact rule-subject-end parity., Lookup-only far endpoints.], implementation_status: not evaluated, evidence_refs: []}
  - {id: D009, summary: "The query oracle is test-only and shares no production evaluation or reduction.", authority_refs: [VellisVerification::semanticQuery], alternatives: [Import production evaluation.], reversible: true, owner_work_item_id: W003, evidence_intent: [Detect deliberately mutated compiler results.], implementation_status: not evaluated, evidence_refs: []}
