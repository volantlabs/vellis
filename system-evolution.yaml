scope:
  authority_scope: [RTG::'Graph Query', RTGSystem::'Query graph', RTGSystem::'Assess graph conformance', VellisRequirements::querySafety, VellisRequirements::validationCoverage, VellisRequirements::historyIndependentCurrentWork, VellisVerification::semanticQuery, VellisVerification::currentWorkScaling]
  implementation_scope: [vellis/query.py, vellis/store.py, vellis/normalized.py, tests/vellis/, README.md, system-evolution.yaml]
  review_lenses: [authority and conformance, engineering and evidence]
  non_goals:
    - Changing the SysML model, public APIs, MCP schemas, persistence schema, snapshot formats, version, or v1 compatibility.
    - Introducing numerical latency targets or materializing a resident complete graph.
    - Touching ignored owner data, external clients, releases, tags, or pull-request state.
findings:
  - id: F001
    summary: Prospective assessment repeatedly expands accumulated participants and relations across the whole connected component.
    classification: implementation defect
    consequence: A local display or property change can perform superlinear work with connected graph size even though no distant invariant can change.
    authority_refs: [VellisRequirements::historyIndependentCurrentWork, VellisRequirements::validationCoverage]
    evidence_refs: [path:tests/vellis/test_sqlite_prospective_state.py#test_display_only_assessment_work_ignores_connected_component_length, path:tests/vellis/test_sqlite_prospective_state.py#test_link_shape_assessment_scales_with_hub_degree_not_second_hop_degree, path:tests/vellis/test_sqlite_prospective_state.py#test_state_wide_rule_cutover_has_linear_sql_step_growth, path:tests/vellis/test_sqlite_prospective_state.py#test_endpoint_type_change_cannot_activate_an_incomplete_multiplicity_closure]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Correct fixed-point findings are obtained by repeatedly rescanning every already reached participant and relation, including unaffected distant objects.
    compatibility_effect: Findings and activation behavior remain unchanged; only forbidden unrelated work is removed.
  - id: F002
    summary: SQLite aggregation fetches and retains every bounded match and then retains a second value population for scalar reduction.
    classification: implementation defect
    consequence: A valid high maximum can exhaust process memory even though the caller receives only one scalar per aggregation.
    authority_refs: [RTG::'Graph Query', VellisRequirements::querySafety, VellisRequirements::historyIndependentCurrentWork]
    evidence_refs: [path:tests/vellis/test_graph_queries.py#test_scalar_aggregation_streams_one_bounded_selection, path:tests/vellis/test_graph_queries.py#test_cancelling_exponents_keep_python_sum_memory_bounded, path:tests/vellis/test_graph_queries.py#test_aggregation_accepts_large_positive_bounds_without_canonical_effects]
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: The selection is bounded semantically but every matching row and value remains resident until reduction completes.
    compatibility_effect: Exact aggregate values, maximum-plus-one refusal, and public result shapes remain unchanged.
  - id: F003
    summary: Public UUID and type collections are interpolated into single SQL placeholder lists.
    classification: implementation defect
    consequence: A valid collection can cross SQLite's host-parameter capacity and return a realization failure instead of its semantic result or whole-result rejection.
    authority_refs: [VellisRequirements::querySafety, VellisRequirements::historyIndependentCurrentWork]
    evidence_refs: [path:tests/vellis/test_graph_queries.py#test_large_uuid_filters_do_not_depend_on_sqlite_host_parameter_capacity, path:tests/vellis/test_graph_queries.py#test_large_type_filters_do_not_depend_on_sqlite_host_parameter_capacity, path:tests/vellis/test_definition_discovery.py#test_large_definition_selection_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_graph_changes.py#test_large_graph_change_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_sqlite_prospective_state.py#test_large_prospective_change_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_sqlite_prospective_state.py#test_large_multiplicity_participant_sets_are_bound_relationally, path:tests/vellis/test_graph_queries.py#test_query_beyond_sqlite_join_capacity_is_refused_whole]
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: Small collections work, while an otherwise identical larger collection fails solely at the database driver's parameter threshold.
    compatibility_effect: Existing requests retain meaning; large collections use relational or chunked binding and structurally excessive queries are rejected whole.
decisions:
  - id: D001
    summary: Track local validation objects, rule-subject work, incident relations, and lookup-only participants separately in indexed temporary relations.
    authority_refs: [VellisRequirements::historyIndependentCurrentWork, VellisRequirements::validationCoverage]
    alternatives: [Retain whole-component closure with a linear frontier., Construct a resident graph.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [Keep display-only work independent of connected-component length., Keep endpoint-type and high-degree multiplicity findings complete.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_sqlite_prospective_state.py#test_display_only_assessment_work_ignores_connected_component_length, path:tests/vellis/test_sqlite_prospective_state.py#test_link_shape_assessment_scales_with_hub_degree_not_second_hop_degree, path:tests/vellis/test_sqlite_prospective_state.py#test_state_wide_rule_cutover_has_linear_sql_step_growth, path:tests/vellis/test_sqlite_prospective_state.py#test_endpoint_type_change_cannot_activate_an_incomplete_multiplicity_closure]
  - id: D002
    summary: Materialize only bounded match identities in SQLite and stream property rows through exact incremental reducers.
    authority_refs: [RTG::'Graph Query', VellisRequirements::querySafety]
    alternatives: [Retain Python match populations., Narrow the public positive maximum.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Bound fetched batches independently of match count., Preserve exact count, sum, minimum, maximum, and refusal semantics in every state scope.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_graph_queries.py#test_scalar_aggregation_streams_one_bounded_selection, path:tests/vellis/test_graph_queries.py#test_cancelling_exponents_keep_python_sum_memory_bounded, path:tests/vellis/test_graph_queries.py#test_aggregation_accepts_large_positive_bounds_without_canonical_effects]
  - id: D003
    summary: Bind public collections through indexed temporary relations or connection-aware chunks and reject structurally unexecutable queries whole.
    authority_refs: [VellisRequirements::querySafety, VellisRequirements::historyIndependentCurrentWork]
    alternatives: [Publish a new collection maximum., Allow driver-capacity failures.]
    reversible: true
    owner_work_item_id: W003
    evidence_intent: [Operate above a deliberately lowered SQLite variable limit., Preserve semantic invalid-input findings and canonical non-effects.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_graph_queries.py#test_large_uuid_filters_do_not_depend_on_sqlite_host_parameter_capacity, path:tests/vellis/test_graph_queries.py#test_large_type_filters_do_not_depend_on_sqlite_host_parameter_capacity, path:tests/vellis/test_definition_discovery.py#test_large_definition_selection_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_graph_changes.py#test_large_graph_change_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_sqlite_prospective_state.py#test_large_prospective_change_does_not_depend_on_sqlite_host_parameters, path:tests/vellis/test_sqlite_prospective_state.py#test_large_multiplicity_participant_sets_are_bound_relationally, path:tests/vellis/test_graph_queries.py#test_query_beyond_sqlite_join_capacity_is_refused_whole]
