evolution:
  id: vellis-2-semantic-work-locality
  objective: Replace locally optimized query and validation paths with one connected-tree query meaning and one exact reason-aware invariant-impact meaning.
  observable_distinction: Hidden query witnesses cannot multiply answer work, and ordinary mutation contains only exact applicable rule-subject-end work rather than broad neighborhoods.
  lifecycle: awaiting-approval
  approval: {status: pending, reason: "The query language, output and row identity, state selection, compatibility, and mutation locality change accepted meaning.", checkpoint: null}
  blocker: null
  checkpoint: git:6060a99dc159fe49304db99ebb7573055e7925cf
