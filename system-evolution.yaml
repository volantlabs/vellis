scope:
  authority_scope:
    - RTG::'JSON Value'
    - RTG::'Graph Query Result'
    - RTGSystem
    - VellisRequirements
    - VellisVerification
    - SysML 2.1 Beta 1 sections 7.21.1, 7.21.2, and 7.24.2
  implementation_scope:
    - model/*.sysml
    - vellis/query.py
    - vellis/store.py
    - vellis/system.py
    - vellis/__main__.py
    - pyproject.toml
    - uv.lock
    - tests/
    - README.md
    - CONTRIBUTING.md
    - docs/mcp-realization.md
    - .github/workflows/check.yml
  review_lenses:
    - authority and conformance
    - engineering and evidence
  non_goals:
    - Adopting raw v1 storage, v1 ledger history, or same-directory in-place conversion.
    - Changing MCP tool names, schemas, persistence format, authorization, or exact FastMCP 4.0.0b1 pins.
    - Merging, tagging, publishing, or touching real ignored owner data.
findings:
  - id: F001
    summary: Normative requirement and case-objective prose is not owned by required constraints.
    classification: model gap
    consequence: Satisfaction and verification can be present while constraining none of the documented obligations.
    authority_refs: [VellisRequirements, VellisVerification, SysML 2.1 Beta 1 sections 7.21.1 and 7.21.2]
    evidence_refs: [command:just model-check]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Every relationship exists while a system violating every documented shall statement still satisfies empty formal constraints.
    compatibility_effect: Existing obligation text becomes formally required without changing selected normal behavior or payloads.
  - id: F002
    summary: The Everyday Life verification case implicitly binds RTG requirements to a Vellis System subject.
    classification: model gap
    consequence: The case does not verify fresh initialization and graph invariants against the contained RTG memory.
    authority_refs: [VellisVerification::'Everyday Life Is An Optional Confirmed Start', SysML 2.1 Beta 1 section 7.24.2]
    evidence_refs: [command:just model-check]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The product choice passes while contained memory violates RTG requirements because verify subjects default to Vellis.
    compatibility_effect: Verification binding changes only; the owner scenario and product behavior remain unchanged.
  - id: F003
    summary: Accepted authority does not define completion when a required activity append fails.
    classification: model gap
    consequence: Best-effort observation can return success without mandatory evidence, or failure handling can recurse without a completion boundary.
    authority_refs: [VellisRequirements::dualLedgerSeparation, VellisRequirements::mcpOutcomeIntegrity, RTGSystem::'Assess graph conformance']
    evidence_refs: [path:tests/vellis/test_activity_history.py#test_a_broken_activity_ledger_cannot_break_the_operation_it_observes]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: An observation-bearing operation completes even though its required activity record was never stored.
    compatibility_effect: Observation failure becomes unexpected with no completed result; accepted canonical mutations remain canonical-ledger authoritative.
  - id: F004
    summary: Stored projected rows deduplicate nested JSON by serialized spelling before enforcing the row bound.
    classification: implementation defect
    consequence: Mathematically equal nested numbers can produce duplicate rows and an incorrect whole-query refusal.
    authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::semanticQueryMeaning, VellisRequirements::querySafety]
    evidence_refs: [path:tests/vellis/test_graph_queries.py#test_a_projected_property_participates_in_row_identity]
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: Nested 3 and 3.00 are two SQL rows although public equality says they are one value.
    compatibility_effect: Equal duplicates collapse correctly; stored values and genuinely distinct rows are unchanged.
  - id: F005
    summary: Required activity append failures are swallowed after outcomes are computed.
    classification: implementation defect
    consequence: Reads and safely reported non-success outcomes can appear complete without mandatory activity evidence.
    authority_refs: [VellisRequirements::dualLedgerSeparation, VellisRequirements::mcpOutcomeIntegrity]
    evidence_refs: [path:tests/vellis/test_activity_history.py#test_a_broken_activity_ledger_cannot_break_the_operation_it_observes]
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: A broken activity table leaves successful reads indistinguishable from fully observed operations.
    compatibility_effect: Observation-store faults surface as unexpected failures; normal completed outcomes are unchanged.
  - id: F006
    summary: Validation assessment publication commits before its required observation is attempted.
    classification: implementation defect
    consequence: Failing closed can still replace the prior assessment although no completed validation result reaches the caller.
    authority_refs: [VellisRequirements::validationCoverage, VellisRequirements::dualLedgerSeparation, RTGSystem::'Assess graph conformance']
    evidence_refs: [path:tests/vellis/test_activity_history.py#test_a_non_conforming_graph_is_recorded_as_a_completed_assessment]
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: Unexpected validation failure silently replaces the prior retrievable assessment.
    compatibility_effect: Assessment and activity publication become one observational transaction; schema and successful reports remain unchanged.
  - id: F007
    summary: The replacement branch removed installable package metadata and both released console entry points.
    classification: implementation defect
    consequence: Isolated locked invocation fails before setup, serving, recovery, or actionable guidance is reachable.
    authority_refs: [VellisRequirements::simpleIndividualOperation]
    evidence_refs: [command:uv run pytest tests/test_repository_policy.py -q]
    disposition: resolved
    owner_work_item_id: W004
    implementation_status: conforming
    nearest_wrong_system: Source modules pass while the installed v1 command identities cannot import or dispatch v2.
    compatibility_effect: Both executable names dispatch an installable 2.0.0 owner command surface.
  - id: F008
    summary: Guidance does not explain how untouched v1 data can be exported after v2 replaces the CLI.
    classification: plan gap
    consequence: The supported importer exists, but an owner may conclude recovery required a pre-upgrade export.
    authority_refs: [VellisRequirements::v1SnapshotCompatibility, VellisRequirements::simpleIndividualOperation]
    evidence_refs: [path:README.md#implementation-status]
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: Correct import behavior is documented as though unsupported raw conversion or pre-upgrade export were required.
    compatibility_effect: A v1.0 fixture and post-upgrade runbook evidence the accepted snapshot-to-new-lineage path.
  - id: F009
    summary: Gates do not reject vacuous constraints, backend equality drift, silent observation loss, or unbuildable artifacts.
    classification: plan gap
    consequence: Syntax and source-tree tests can stay green while all underlying defects recur.
    authority_refs: [AGENTS.md, VellisVerification]
    evidence_refs: [command:just check]
    disposition: plan-change
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: The project gate passes with bare normative docs, serialized identity, best-effort audit, and no wheel.
    compatibility_effect: Evidence and CI become stricter without changing product payload or persistence compatibility.
decisions:
  - id: D001
    summary: Stream SQL projections and apply the shared semantic row identity before maximumRows.
    authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::querySafety]
    alternatives: [Canonicalize and migrate nested stored JSON numbers., Keep serialized SQL equality.]
    reversible: true
    owner_work_item_id: W002
    evidence_intent: [Equal nested spellings collapse on all evaluators., Retain at most maximumRows plus one unique row.]
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_nested_numeric_spellings_are_one_bounded_semantic_row
      - path:tests/vellis/test_graph_queries.py#test_maximum_rows_rejects_genuinely_unequal_nested_values
  - id: D002
    summary: Publish validation assessment and required activity in one SQLite transaction.
    authority_refs: [VellisRequirements::validationCoverage, VellisRequirements::dualLedgerSeparation]
    alternatives: [Roll back a separately committed assessment., Keep observation best-effort.]
    reversible: true
    owner_work_item_id: W003
    evidence_intent: [Fault injection preserves the exact prior current assessment.]
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_activity_history.py#test_validation_observation_failure_preserves_the_prior_assessment_atomically
  - id: D003
    summary: Preserve confirmed complete-v1-snapshot import as a new v2 lineage; reject raw and in-place migration scope.
    authority_refs: [VellisRequirements::v1SnapshotCompatibility]
    alternatives: [Adopt raw predecessor storage and history., Replace a v1 directory in place.]
    reversible: false
    owner_work_item_id: W005
    evidence_intent: [A v1.0 export preserves representable meaning and reports every simplification or omission.]
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_v1_streaming.py#test_representative_v1_export_reports_every_unrepresentable_refinement
      - path:tests/vellis/test_v1_streaming.py#test_representative_v1_export_preserves_graph_and_starts_one_new_lineage
  - id: D004
    summary: Freeze the reviewed installable candidate at version 2.0.0 before merge.
    authority_refs: [VellisRequirements::simpleIndividualOperation]
    alternatives: [Retain 0.2.0.dev0 through merge., Make an unreviewed post-merge version change.]
    reversible: true
    owner_work_item_id: W004
    evidence_intent: [Built metadata, imported version, lock, and commands agree on 2.0.0.]
    implementation_status: conforming
    evidence_refs: [command:just package-check]
