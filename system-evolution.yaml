        coverage: full
        remaining_work_item_ids: []
    approval:
      status: not-required
      reason: Existing accepted authority already decides these implementation defects.
      checkpoint: null
    nearest_wrong_system: Narrow historical results still cause linear filtered-prefix work or complete-interval decoding.
    compatibility_effect: Owner-facing history results remain semantically unchanged; no released store format requires migration.
    non_effects:
      - Canonical and activity ledger ordering and contents do not change.
      - Whole-result rejection and inclusive interval semantics do not change.
    lifecycle: ready
    implementation_status: partial
    evidence_refs:
      - path:tests/vellis/test_historical_selection.py
      - path:tests/vellis/test_activity_history.py
    blocker: null
