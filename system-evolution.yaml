findings:
  - id: F001
    summary: The two union-input tools advertised a top-level oneOf with no type, which a strict MCP client rejects.
    classification: implementation defect
    consequence: rtg_draft_inspect and rtg_validate produced inputSchema without type object, and because a client validates the whole tools/list response, two malformed schemas made all ten tools unavailable rather than degrading only themselves.
    authority_refs: [VellisRequirements::mcpBoundary]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_public_server_lists_strict_selected_tools_and_calls_successor]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The server starts, reports healthy, and answers initialize, while every tool is silently unusable because the inventory response failed client-side validation.
    compatibility_effect: No accepted input changes; each union branch already declared type object, so requests valid before remain valid and requests invalid before remain invalid.
  - id: F002
    summary: The tool-schema assertion excused oneOf schemas instead of requiring the MCP type, so it could never observe this defect.
    classification: implementation defect
    consequence: The suite encoded the malformed shape as acceptable, and the installed-boundary probe counted ten tools without validating their schemas, so nothing in the gate could distinguish a loadable inventory from an unloadable one.
    authority_refs: [VellisVerification::mcpLifecycle]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_public_server_lists_strict_selected_tools_and_calls_successor]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A schema assertion whose disjunction is satisfied by the very shape that breaks clients, so the gate stays green while the product is unusable.
    compatibility_effect: No product effect; the assertion is strictly narrower than before.
decisions:
  - id: D001
    summary: Declare type object alongside oneOf in the shared union-schema builder rather than restructuring the input models or rewriting schemas downstream.
    authority_refs: [VellisRequirements::mcpBoundary]
    alternatives: [Collapse each union into one optional-field model and lose the mutually exclusive fresh-versus-continuation distinction., Post-process generated schemas outside the builder., Special-case the two tools individually.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [Every tool schema declares type object., Both union tools still accept exactly their fresh and continuation shapes and still reject unknown members.]
    implementation_status: conforming
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_public_server_lists_strict_selected_tools_and_calls_successor]
