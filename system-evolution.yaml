schema_version: "1.0"
evolution:
  id: vellis-2-union-tool-schema-fix
  objective: Make every public MCP tool schema acceptable to a strict client so the whole tool inventory loads rather than being rejected wholesale.
  observable_distinction: A strict MCP client that validates inputSchema.type accepts all ten tools instead of rejecting the entire tools/list response, and the suite fails if any tool schema stops declaring type object.
  lifecycle: complete
  approval:
    status: not-required
    reason: RTG014 already requires the boundary to expose its selected behaviors through ordinary typed JSON values; a schema a conforming client rejects is an implementation defect under that accepted meaning.
    checkpoint: null
  blocker: null
  checkpoint: git:730929ff387bac8a243b125c71c6d62095f36210
