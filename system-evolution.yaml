schema_version: "1.0"
evolution:
  id: callable-tool-surface-and-value-fidelity
  objective: Close pre-release boundary, campaign-handoff, and public-guidance findings without changing accepted system meaning.
  observable_distinction: Snapshot publication never replaces another name, every owner-facing failure reports its true operation and complete known state effect, every campaign result is bound to current work, and security and query guidance match the runnable local surface.
  lifecycle: active
  approval:
    status: not-required
    reason: The new findings are implementation, workflow-validation, and documentation defects under unchanged accepted authority.
    checkpoint: null
  blocker: null
  checkpoint: git:f35f2a1f7405915ecac6e82b715f1eb1de22c661
