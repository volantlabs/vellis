scope:
  authority_scope:
    - model/10-rtg-domain.sysml
    - model/20-rtg-system.sysml
    - model/30-vellis.sysml
    - model/40-requirements.sysml
    - model/50-verification.sysml
  implementation_scope:
    - vellis
    - tests/vellis
    - tools
  review_lenses:
    - authority and conformance
    - engineering and evidence
    - resource behavior and durability
    - portable evolution method
  non_goals:
    - Numerical latency or storage budgets without representative owner data and hardware.
    - Mutation of user-owned .data content or live external client configuration.
    - Rewriting the v2 implementation-campaign history rather than preserving it as the source baseline.
    - Broad test-suite consolidation beyond correcting evidence made stale or non-discriminating by this evolution.
findings:
  - id: F001
    summary: Every current operation decodes the complete serialized canonical-state tuple.
    classification: realization decision
    consequence: Definition-only and metadata reads repeatedly parse and allocate the unchanged graph, so steady-state work and memory churn scale with unrelated graph population.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - RTGSystem::'RTG System'::currentState
    evidence_refs:
      - command:uv run pytest tests/vellis/test_store_integrity.py
      - command:uv run pytest tests/vellis/test_current_work.py
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: Repeated current operations deserialize the unchanged complete graph and definition tuple from one durable blob.
    compatibility_effect: No released store format exists; replace the experimental layout without migration while preserving public state semantics.
  - id: F002
    summary: Historical definition lookup can walk graph-only transition prefixes.
    classification: implementation defect
    consequence: SQLite may seek the ordinal index and filter every unrelated graph mutation even though accepted authority forbids replaying unrelated graph-only transitions.
    authority_refs:
      - VellisRequirements::boundedHistoricalSelectionWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_history_growth.py
      - command:uv run pytest tests/vellis/test_historical_selection.py
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: A historical definition lookup returns few definition transitions while SQLite filters a linearly growing graph-only prefix underneath the result.
    compatibility_effect: Query results are unchanged; no migration of the unreleased experimental store layout is required.
  - id: F003
    summary: Bounded history reads fetch and decode the complete interval before enforcing maximumRecords.
    classification: implementation defect
    consequence: A request bounded to one record can process an arbitrarily large selected interval before returning the required whole-result rejection.
    authority_refs:
      - VellisRequirements::boundedHistoryRead
      - VellisRequirements::boundedHistoricalSelectionWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_history_growth.py
      - command:uv run pytest tests/vellis/test_snapshot_replay.py
      - command:uv run pytest tests/vellis/test_activity_history.py
    disposition: resolved
    owner_work_item_id: W002
    implementation_status: conforming
    nearest_wrong_system: A maximumRecords value of one still retrieves and decodes the complete matching history interval before whole-result rejection.
    compatibility_effect: Limiting retrieval to maximumRecords plus one preserves accepted and rejected result meaning.
  - id: F004
    summary: Query evaluation enumerates assignments that no projection or remaining constraint can distinguish.
    classification: model gap
    consequence: A small distinct result can require a Cartesian walk over unrelated unprojected selector populations, while current authority constrains result meaning but not this resource consequence.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_queries.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A query with one projected selector and a large disconnected unprojected selector enumerates their Cartesian assignments before deduplication.
    compatibility_effect: Distinct row meaning and maximumRows remain unchanged; only semantically redundant work is removed.
  - id: F005
    summary: Existing scaling evidence counts returned records but misses decoding, allocation, query-plan filtering, and assignment work.
    classification: plan gap
    consequence: The complete test gate can pass while operations perform linear or combinatorial internal work that the evidence counters do not observe.
    authority_refs:
      - VellisVerification::'Current Operations Ignore History Length'
      - VellisVerification::'Historical Selection Avoids Irrelevant Records'
      - VellisVerification::'History Growth Performance Characterization'
    evidence_refs:
      - command:uv run pytest tests/vellis/test_history_growth.py
      - command:uv run pytest tests/vellis/test_current_work.py
      - command:uv run pytest tests/vellis/test_historical_selection.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Returned-record counters and small fixtures pass while hidden filtering, state decoding, allocation, or joint-assignment work grows materially.
    compatibility_effect: Stronger evidence adds instrumentation and representative populations without changing public behavior.
  - id: F006
    summary: The original implementation campaign did not select or evidence a consequential current-state realization.
    classification: plan gap
    consequence: Storage remained nominally open, but no slice owned the choice between resident, decomposed durable, or repeatedly serialized working state and its nearest resource failure.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - model/README.md
    evidence_refs:
      - command:just implementation-campaign-check
    disposition: resolved
    owner_work_item_id: W004
    implementation_status: conforming
    nearest_wrong_system: A complete build closes without one owner for a consequential working-state realization and its discriminating resource evidence.
    compatibility_effect: The evolution record supplements the build record without treating an unreleased experimental layout as a compatibility boundary.
  - id: F007
    summary: Evolution status can report an earlier ready item instead of the item that currently owns mutation.
    classification: implementation defect
    consequence: A resumed agent can be directed away from the sole active work item even though the record itself validates.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-record.md#baselines-and-lifecycle
    evidence_refs:
      - command:just system-evolution-check
      - command:uv run pytest tests/test_system_evolution.py
    disposition: resolved
    owner_work_item_id: W004
    implementation_status: conforming
    nearest_wrong_system: The record has exactly one active writer but status labels an earlier ready item as next work.
    compatibility_effect: Status output becomes consistent with existing lifecycle meaning; record shape and product behavior do not change.
  - id: F008
    summary: Complete-state assembly can mix committed revisions across SQLite connections.
    classification: implementation defect
    consequence: A writer can commit between projection metadata and graph reads, producing a state or snapshot tuple that no canonical revision established.
    authority_refs:
      - VellisRequirements::atomicCanonicalRevision
      - VellisRequirements::canonicalSnapshotCompleteness
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py
      - command:uv run pytest tests/vellis/test_snapshot_replay.py
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: Per-process locking prevents local overlap but separate committed reads assemble revision metadata and graph content from different SQLite snapshots.
    compatibility_effect: One read transaction changes no public result shape or unreleased storage compatibility promise.
  - id: F009
    summary: Directed links do not pre-narrow associated-data endpoints.
    classification: implementation defect
    consequence: Property filtering decodes every type-and-association candidate even when a sparse directed relationship excludes nearly all of them.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_queries.py
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: Anchor endpoints use link-pair semijoins before decoding, but associated-data endpoints wait until after property comparison to test the same link.
    compatibility_effect: Joint query results remain unchanged while irrelevant associated data is not decoded or compared.
  - id: F010
    summary: A UUID of another declared selector type is accepted as an empty result.
    classification: implementation defect
    consequence: Identity validation proves only the broad object kind and silently treats a type-incompatible named identity as no jointly satisfying assignment.
    authority_refs:
      - RTGSystem::'RTG System'::queryCurrentGraph
      - VellisVerification::invalidQuery
    evidence_refs:
      - command:uv run pytest tests/vellis/test_invalid_queries.py
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: A project UUID in a person selector passes known-anchor validation and later disappears in type candidate selection.
    compatibility_effect: Invalid identity restrictions gain findings; compatible restrictions and accepted-empty joint results do not change.
  - id: F011
    summary: Projection-integrity tests stop at the transaction seal.
    classification: plan gap
    consequence: Removing selector-to-payload comparison would leave the new evidence green because deliberate corruption is rejected earlier as an unsealed write.
    authority_refs:
      - VellisRequirements::atomicCanonicalRevision
    evidence_refs:
      - command:uv run pytest tests/vellis/test_store_integrity.py
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: The transaction seal is tested twice while the independent indexed-selector consistency checks have no discriminating case.
    compatibility_effect: Test-only resealing separates the two integrity failure modes without changing product behavior.
  - id: F012
    summary: Duplicate evolution IDs can be collapsed before validation.
    classification: implementation defect
    consequence: One finding, decision, or work item can shadow another and let ownership or closure checks inspect only the final row.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-record.md#record-consistency
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Dictionaries are built before duplicates are counted, making duplicates within one record collection invisible.
    compatibility_effect: Invalid records are rejected; valid portable record shape is unchanged.
  - id: F013
    summary: Vellis baseline freshness is self-asserted rather than derived.
    classification: plan gap
    consequence: A stale but internally repeated Git/model/environment identity can validate as current and complete against a different repository state.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-record.md#baselines-and-lifecycle
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Git references need only exist and declared target equals declared observed, even if neither represents the checked repository.
    compatibility_effect: Repository-derived Vellis bindings strengthen validation without imposing Git on the portable method.
  - id: F014
    summary: Closure reviews and evidence can be fabricated or omit declared lenses.
    classification: plan gap
    consequence: Arbitrary commands, unresolved path fragments, and only two hard-coded clean labels can close a record whose declared review scope is broader.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-execution.md#review-and-remediation
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: A clean status string has no reviewed checkpoint or reviewer identity and evidence references prove only that a file exists.
    compatibility_effect: Review entries gain portable attribution fields while Vellis validates its own evidence convention.
  - id: F015
    summary: Accepted approvals can name nonexistent checkpoints.
    classification: plan gap
    consequence: Cold reconstruction cannot distinguish an owner gate from an arbitrary nonempty assertion.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-execution.md#approval-gates
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Approval validation checks only status and non-null text while omitting the checkpoint from project resolution.
    compatibility_effect: Projects retain their own checkpoint convention; Vellis binds accepted gates to its durable record transition.
  - id: F016
    summary: Evolution lifecycle, dependency order, and completion ownership are under-constrained.
    classification: plan gap
    consequence: Resumption can accept inverted dependencies or lifecycle roll-ups with no matching work or approval frontier.
    authority_refs:
      - .agents/skills/sysml-evolution/references/evolution-record.md#baselines-and-lifecycle
      - .agents/skills/sysml-evolution/references/evolution-record.md#record-consistency
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Individual status tokens validate while their joint execution meaning is impossible or misleading.
    compatibility_effect: Invalid process states are rejected; projects remain free to bind lifecycle to their own continuation mechanism.
  - id: F017
    summary: The portable evolution template assumes file-based evidence.
    classification: implementation defect
    consequence: A supposedly neutral starter imports Vellis path syntax into projects whose evidence lives in another system of record.
    authority_refs:
      - .agents/skills/sysml-evolution/SKILL.md
    evidence_refs:
      - command:just skills-check
    disposition: implementation-work
    owner_work_item_id: W006
    implementation_status: partial
    nearest_wrong_system: Portable prose is neutral but the machine template teaches every adopter to use path:test-or-analysis#case.
    compatibility_effect: A convention-neutral placeholder preserves the schema while Vellis keeps path and command bindings locally.
decisions:
  - id: D001
    summary: Keep live graph objects, definitions, and proposal state in addressable SQLite projections with no resident complete-state cache.
    authority_refs:
      - VellisRequirements::atomicCanonicalRevision
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::historyIndependentCurrentWork
    alternatives:
      - Keep a revision-aware complete resident projection per process.
      - Normalize every property into fully relational storage and compile the complete query language to SQL.
      - Decode the complete current-state serialization on every operation.
    reversible: true
    owner_work_item_id: W005
    evidence_intent:
      - Definition-only reads decode no graph objects.
      - Current query candidates are joined through identity, type, association, and directed-link indexes before property filtering.
      - Public complete-state inspection cannot mutate durable canonical state and no complete state is retained between calls.
      - A canonical transition and every affected projection row commit atomically.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py
      - command:uv run pytest tests/vellis/test_graph_queries.py
  - id: D002
    summary: Evaluate independent selector components separately and treat unprojected components as existence constraints.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    alternatives:
      - Retain full assignment enumeration and deduplicate only after projection.
      - Introduce a general-purpose external query engine.
    reversible: true
    owner_work_item_id: W003
    evidence_intent:
      - Evaluation order preserves identical rows and whole-result bounds.
      - Unprojected disconnected populations do not multiply projected assignment work.
      - Unsatisfied unprojected components still eliminate every result row.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_queries.py
