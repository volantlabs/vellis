    planned_baseline: sha256:ad02d24b6c6eeb38f904d551e0ae7dfd48101ff41e44db79effb3014e137e4c6
    finding_ids:
      - F001
    decision_ids:
      - D001
      - D002
    authority:
      - refs:
          - VellisRequirements::atomicCanonicalRevision
          - VellisRequirements::durableCanonicalHistory
          - VellisRequirements::semanticQueryMeaning
        coverage: full
        remaining_work_item_ids: []
    approval:
      status: accepted
      reason: The owner selected SQLite-owned live state and explicitly declined compatibility work for the unreleased experimental format.
      checkpoint: owner-acceptance:2026-08-12
    nearest_wrong_system: Correct results are produced from SQLite but every query first materializes a broad or complete graph instead of joining indexed identities.
    compatibility_effect: Durable ledger authority, public query results, and restart recovery remain; the unreleased SQLite layout is replaced without migration.
    non_effects:
