  - {id: F012, summary: "The selected Python and MCP query contract is absent from the durable realization handoff.", classification: plan gap, consequence: "A cold implementation agent can preserve model meaning while still choosing incompatible prerelease class and field names.", authority_refs: [RTG::'Graph Query', VellisRequirements::mcpAgentToolContract], evidence_refs: [path:docs/semantic-work-locality-handoff.md#public-contract-and-analyzer], disposition: resolved, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "The language-neutral model is implemented with a different Python schema than the owner-selected clean break.", compatibility_effect: "The exact new prerelease Python and MCP field shapes are now reconstructible without changing SysML authority."}
