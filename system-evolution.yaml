findings:
  - id: F001
    summary: Successful active validation retains multiplicity seed rows proportional to the completed graph change.
    classification: implementation defect
    consequence: A long-lived connection retains rows from the largest prior active mutation until a later mutation or assessment happens to clear them.
    authority_refs: [VellisRequirements::historyIndependentCurrentWork, VellisRequirements::explicitGraphChangeSet]
    evidence_refs: [path:tests/vellis/test_semantic_work_locality.py#test_active_graph_change_clears_multiplicity_work_after_every_exit]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Active validation performs exact local work but commits while its reusable population rows remain resident.
    compatibility_effect: Active outcomes and canonical effects remain unchanged; only completed transient rows are cleared sooner.
  - id: F002
    summary: Assessment cleanup evidence relies on nonempty residue from a completed active mutation.
    classification: plan gap
    consequence: Fixing active cleanup breaks a test precondition, while no permanent evidence directly requires empty active-mutation work after every exit.
    authority_refs: [VellisVerification::currentWorkScaling]
    evidence_refs: [path:tests/vellis/test_semantic_work_locality.py#test_active_graph_change_clears_multiplicity_work_after_every_exit, path:tests/vellis/test_semantic_work_locality.py#test_assessment_and_restore_clear_population_work_after_success_and_failure]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Assessment cleanup remains tested while active mutation can retain work indefinitely without a failing regression.
    compatibility_effect: Evidence changes from depending on residue to rejecting it; system meaning is unchanged.
  - id: F003
    summary: Evolution-validator tests assume the live evolution contains a dependent work item.
    classification: plan gap
    consequence: A valid single-item successor fails the full gate before exercising the validator rule each test names.
    authority_refs: [AGENTS.md]
    evidence_refs: [path:tests/test_system_evolution.py#test_only_one_work_item_may_be_active, path:tests/test_system_evolution.py#test_executable_work_requires_complete_dependencies]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Tests claim record-shape independence while using positional or mandatory-dependent access to the live record.
    compatibility_effect: Validator behavior is unchanged; tests synthesize the dependency topology their individual rule requires.
