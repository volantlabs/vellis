findings:
  - id: F001
    summary: Canonical record sealing rescans every current graph and proposal row.
    classification: implementation defect
    consequence: A one-object mutation, graph proposal edit, definition edit, activation, or discard performs work proportional to unrelated graph and proposal population merely to derive resulting-state identity.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::atomicCanonicalRevision
      - VellisVerification::currentWorkScaling
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_sqlite_prospective_state.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Graph objects are not decoded, but every effective canonical write still hashes every unrelated current row.
    compatibility_effect: Schema five replaces unreleased schema four without migration; public tool meaning is unchanged.
  - id: F002
    summary: Focused definition work scans unrelated definition and relationship populations.
    classification: implementation defect
    consequence: One requested definition neighborhood and one affected mutation rule lookup perform SQL work proportional to unrelated definitions and multiplicity rules despite decoding only requested definitions.
    authority_refs:
      - VellisRequirements::agentDefinitionDiscoverability
      - VellisRequirements::historyIndependentCurrentWork
      - VellisVerification::currentWorkScaling
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_definition_discovery.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Decode counters remain local while temporary source maps and unindexed participant searches scan all definitions.
    compatibility_effect: Only SQLite indexes and private query plans change; public definition results remain unchanged.
  - id: F003
    summary: Tail replay recomputes complete state identity after every record.
    classification: implementation defect
    consequence: Importing a tail of T local records over a graph of N objects performs O(N times T) state-summary work rather than work proportional to the snapshot plus required tail rows.
    authority_refs:
      - VellisRequirements::replayEquivalence
      - VellisRequirements::boundedHistoricalSelectionWork
      - VellisVerification::replayCharacterization
    evidence_refs:
      - command:uv run pytest tests/vellis/test_streaming_lifecycle.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Snapshot and tail buffers remain bounded while each tail record silently scans the complete reconstructed graph.
    compatibility_effect: Schema-five snapshot and tail headers replace unreleased schema-four streams without adapters.
  - id: F004
    summary: Adjacent historical restore compares the complete graph.
    classification: implementation defect
    consequence: Restoring one prior object version scans selected and current full graph populations instead of only identities changed after the selected revision.
    authority_refs:
      - VellisRequirements::historicalRestoreSemantics
      - VellisRequirements::boundedHistoricalSelectionWork
      - VellisVerification::restoreHistory
    evidence_refs:
      - command:uv run pytest tests/vellis/test_historical_restore.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Restore is set-based and bounded-memory but still visits every unrelated current object for a one-object tail.
    compatibility_effect: Restoration results and ledger meaning remain unchanged.
decisions:
  - id: D001
    summary: Maintain current graph and proposal semantic summaries transactionally in schema five.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
      - VellisRequirements::atomicCanonicalRevision
      - VellisRequirements::historyIndependentCurrentWork
    alternatives:
      - Recompute every state facet on each record seal.
      - Cache summaries only in process memory.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Fixed writes ignore unrelated population while independent full recomputation detects summary drift.
      - Fault injection leaves graph rows, summaries, head, events, and identities mutually unchanged.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_population_local_work.py#test_ordinary_writes_are_independent_of_unrelated_graph_population
  - id: D002
    summary: Resolve focused definition closure and applicable rules through reverse indexes and a keyed frontier.
    authority_refs:
      - VellisRequirements::agentDefinitionDiscoverability
      - VellisRequirements::historyIndependentCurrentWork
    alternatives:
      - Build complete temporary source maps before narrowing.
      - Retain a process-wide definition cache.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Focused inspection and one affected mutation remain local as unrelated definitions and rules increase.
      - Full assessment remains exhaustive while decoding each encountered type definition once.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_population_local_work.py#test_connected_definition_frontier_processes_each_edge_once
  - id: D003
    summary: Replay and restore advance semantic summaries from explicit events and changed identities.
    authority_refs:
      - VellisRequirements::replayEquivalence
      - VellisRequirements::historicalRestoreSemantics
      - VellisRequirements::boundedHistoricalSelectionWork
    alternatives:
      - Recompute complete graph identity after every tail record.
      - Compare complete selected and current graph populations during restore.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Tail work scales with tail records and adjacent restore with changed tail identities.
      - Explicit integrity verification still recomputes and compares complete required state.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_population_local_work.py#test_adjacent_restore_depends_on_changed_tail_uuids_not_population
