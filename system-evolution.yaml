scope:
  authority_scope:
    - model/10-rtg-domain.sysml
    - model/20-rtg-system.sysml
    - model/30-vellis.sysml
    - model/40-requirements.sysml
    - model/50-verification.sysml
  implementation_scope:
    - vellis/canonical.py
    - vellis/definitions.py
    - vellis/graph.py
    - vellis/query.py
    - vellis/normalized.py
    - vellis/streaming.py
    - vellis/v1_streaming.py
    - vellis/system.py
    - vellis/store.py
    - vellis/serialization.py
    - vellis/mcp.py
    - vellis/setup.py
    - vellis/preserve.py
    - tests/vellis
  review_lenses:
    - authority and conformance
    - engineering and evidence
  non_goals:
    - Numerical latency targets without representative owner data and hardware.
    - Mutation, inspection, or migration of user-owned .data content.
    - Query-local link-cache optimization without a demonstrated product consequence.
    - Backward compatibility or migration for unreleased prototype database and API forms.
findings:
  - id: F001
    summary: Facet-only definition work materializes the complete current graph.
    classification: implementation defect
    consequence: A no-op proposal equal to active definitions and discarding a present proposal decode every unrelated graph object even though their result and state effects require only definition, delta, and revision facets.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::nonDisruptiveDefinitionWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Definition-only no-op and discard results are correct while their transient decoding and allocation scale linearly with unrelated graph population.
    compatibility_effect: Public results and durable meaning remain unchanged; no released database layout requires migration.
  - id: F002
    summary: Transition fidelity validation round-trips an obsolete complete-state storage form.
    classification: implementation defect
    consequence: Every transition serializes the complete resulting graph to validate a form only initialization stores, while the transition actually stores its replay-sufficient change, changed facets, and affected projection rows.
    authority_refs:
      - VellisRequirements::atomicCanonicalRevision
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::historyIndependentCurrentWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_graph_changes.py
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A transition remains replayable in ordinary cases but screens a representation it does not write and re-encodes unchanged graph state on every commit.
    compatibility_effect: Stored transition meaning remains unchanged; the unreleased implementation may correct its internal validation without migration.
  - id: F003
    summary: Ordinary graph mutation and proposal activation may still materialize the complete graph.
    classification: model gap
    consequence: The current model explicitly permits complete-graph change validation when invariants require it, so a one-object mutation may decode every unrelated object and still conform despite the stronger SQLite-native mutation direction.
    authority_refs:
      - VellisRequirements::explicitGraphChangeSet
      - VellisRequirements::graphInvariants
      - VellisRequirements::historyIndependentCurrentWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_changes.py tests/vellis/test_current_work.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: SQLite owns durable state but ordinary mutation validation reconstructs the complete graph before applying a bounded change.
    compatibility_effect: A stronger resource obligation would preserve public mutation meaning while requiring a new internal validation strategy; no released layout requires migration.
  - id: F004
    summary: Query-local link caches include names and endpoint-group labels that do not affect SQL selection.
    classification: out of scope
    consequence: Equivalent link shapes under different query-local names can repeat a bounded SQL lookup, but no incorrect result, durability failure, retained state, or material resource consequence was demonstrated.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::historyIndependentCurrentWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_queries.py
    disposition: out-of-scope
    owner_work_item_id: W001
    implementation_status: not applicable
    nearest_wrong_system: A correct query performs a repeated query-local lookup whose consequence remains uncharacterized.
    compatibility_effect: No public or stored meaning changes; revisit only with evidence of a material consequence.
  - id: F005
    summary: Complete-state APIs and lifecycle operations construct resident graph and canonical-state aggregates.
    classification: model gap
    consequence: Snapshot, replay, restore, initialization, historical graph work, and direct state inspection may require memory proportional to all graph and definition content even when complete semantic processing can be streamed or set-based.
    authority_refs:
      - RTGSystem::'Reconstruct canonical state'
      - RTGSystem::'Create canonical snapshot'
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::replayEquivalence
    evidence_refs:
      - command:uv run pytest tests/vellis/test_streaming_lifecycle.py tests/vellis/test_historical_restore.py tests/vellis/test_current_work.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: A semantically correct complete lifecycle operation assembles every object into one process-resident value before producing its effect or artifact.
    compatibility_effect: Complete semantic results remain, but unreleased library APIs returning resident whole state are removed.
  - id: F006
    summary: Current definitions, graph-object bodies, initial state, and canonical changes are stored as opaque JSON documents.
    classification: realization decision
    consequence: SQLite cannot directly enforce natural keys, select focused definition meaning, compare changed values, or replay normalized changes without decoding broad opaque values.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::agentDefinitionDiscoverability
      - VellisRequirements::canonicalSemanticEquality
    evidence_refs:
      - command:uv run pytest tests/vellis/test_store_integrity.py tests/vellis/test_canonical_equality.py tests/vellis/test_current_work.py
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: SQLite stores durable rows but meaningful definitions, object values, and ledger changes remain documents that must be decoded before relational selection or enforcement.
    compatibility_effect: A fresh unreleased database layout replaces the prototype layout with no migration obligation.
  - id: F007
    summary: Current graph query can materialize every candidate of a broad selected type before enforcing its return bound.
    classification: model gap
    consequence: A query returning one row can allocate and decode a population proportional to every same-type object even though indexed selection and maximumRows plus one are sufficient.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
      - VellisRequirements::historyIndependentCurrentWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_queries.py tests/vellis/test_work_characterization.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: Candidate narrowing uses SQLite indexes but transfers an unbounded same-type candidate set into Python before projection and result-bound refusal.
    compatibility_effect: Query rows and refusal meaning remain while evaluation becomes bounded and database-native.
  - id: F008
    summary: Complete conformance findings have no durable bounded retrieval meaning.
    classification: model gap
    consequence: Returning every finding in one call makes response memory and transport proportional to all violations, while truncating findings would prevent an agent from preparing one complete repair batch.
    authority_refs:
      - RTG::'Validation Report'
      - VellisRequirements::validationCoverage
      - VellisRequirements::mcpAgentToolContract
    evidence_refs:
      - command:uv run pytest tests/vellis/test_graph_changes.py tests/vellis/test_mcp_boundary.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: A complete assessment is either returned as one unbounded value or repeatedly recomputed to reveal further findings.
    compatibility_effect: The unreleased check request and result gain assessment identity, total count, and bounded interval retrieval.
  - id: F009
    summary: The sole definition delta cannot stage the graph edits required for one conforming cutover.
    classification: model gap
    consequence: When old data violates new definitions and migrated data violates old definitions, neither ordering can reach the valid post-cutover state even though an atomic combined transition is meaningful.
    authority_refs:
      - RTG::'Definition Delta'
      - RTGSystem::'Activate definition delta'
      - VellisRequirements::nonDisruptiveDefinitionWork
    evidence_refs:
      - command:uv run pytest tests/vellis/test_definition_governance.py tests/vellis/test_graph_changes.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: absent
    nearest_wrong_system: Prospective definitions are singular and durable, but required graph upserts and explicit removals must be applied separately against the wrong active vocabulary.
    compatibility_effect: The unreleased delta becomes one prospective definition-and-graph overlay with explicit active versus prospective selection.
  - id: F010
    summary: Initial and v1 snapshot analysis requires complete transient target state.
    classification: model gap
    consequence: Importing a large snapshot can consume memory proportional to the whole source before validation or establishment even though complete meaning can be incrementally staged and assessed.
    authority_refs:
      - VellisRequirements::freshInitialization
      - VellisRequirements::v1SnapshotCompatibility
      - VellisRequirements::canonicalSnapshotCompleteness
    evidence_refs:
      - command:uv run pytest tests/vellis/test_v1_streaming.py tests/vellis/test_setup_path.py tests/vellis/test_fresh_initialization.py
      - command:just model-check
    disposition: accepted
    owner_work_item_id: W002
    implementation_status: conflicting
    nearest_wrong_system: A compatible complete input is semantically valid but cannot be established without first becoming one resident candidate graph and definition set.
    compatibility_effect: Snapshot and v1 source meaning remain lossless while import becomes incremental and temporary-state backed.
decisions:
  - id: D001
    summary: Transition commits consume the replay-sufficient change and update only facets that the change establishes.
    authority_refs:
      - VellisRequirements::atomicCanonicalRevision
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::historyIndependentCurrentWork
    alternatives:
      - Continue passing and validating a complete resulting state for every transition.
      - Retain complete-state validation but special-case only definition-delta operations.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Definition-only no-ops and discards decode and encode no graph objects.
      - Transition fidelity validation rejects a lossy replay-change encoding.
      - Initial establishment continues to validate and store its complete canonical-state base.
      - Ledger append and changed projection facets remain one atomic SQLite transaction.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_graph_changes.py tests/vellis/test_definition_discovery.py
  - id: D002
    summary: SQLite stores normalized active, prospective, historical, assessment, and canonical-ledger meaning as the live Vellis realization.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::canonicalSemanticEquality
    alternatives:
      - Retain JSON documents for definitions, graph objects, and canonical changes.
      - Keep normalized live state but replay document-valued canonical changes.
    reversible: false
    owner_work_item_id: W003
    evidence_intent:
      - Schema inspection finds no whole-state, whole-definition-set, whole-object, or canonical-change document columns.
      - Natural identities, focused selection, and revision membership are directly addressable.
      - Fresh schema creation has no prototype migration path and never touches user-owned data.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_store_integrity.py tests/vellis/test_current_work.py tests/vellis/test_graph_queries.py tests/vellis/test_graph_changes.py
  - id: D003
    summary: The sole prospective state uses normalized complete-object upserts, tombstones, and explicit unstaging over active state.
    authority_refs:
      - VellisRequirements::definitionCardinality
      - VellisRequirements::nonDisruptiveDefinitionWork
      - VellisRequirements::explicitGraphChangeSet
    alternatives:
      - Require all graph data to conform before definition activation.
      - Supply one potentially unbounded graph-change request at activation time.
    reversible: true
    owner_work_item_id: W004
    evidence_intent:
      - Ordinary current queries ignore prospective entries while explicit prospective queries evaluate the overlay.
      - Incompatible old and new states can cross in one assessed atomic activation.
      - Stale active bases block activation without discarding staged owner work.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_sqlite_prospective_state.py tests/vellis/test_definition_governance.py tests/vellis/test_current_work.py tests/vellis/test_graph_queries.py tests/vellis/test_graph_changes.py tests/vellis/test_store_integrity.py
  - id: D004
    summary: Canonical snapshot artifacts use incrementally hashed streamed NDJSON while SQLite remains the ordinary durable state store.
    authority_refs:
      - VellisRequirements::canonicalSnapshotCompleteness
      - VellisRequirements::replayEquivalence
      - VellisRequirements::freshInitialization
    alternatives:
      - Use a SQLite database copy as the only portable snapshot.
      - Retain one nested JSON document parsed and emitted whole.
    reversible: true
    owner_work_item_id: W005
    evidence_intent:
      - Export and import preserve complete canonical equality and lineage.
      - Peak materialization remains bounded while graph size increases.
      - A changed, incomplete, reordered, or incompatible stream establishes no partial state.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_streaming_lifecycle.py tests/vellis/test_historical_restore.py tests/vellis/test_work_characterization.py
  - id: D005
    summary: Complete validation runs publish immutable revision-bound assessments whose findings are retrieved in bounded intervals.
    authority_refs:
      - VellisRequirements::validationCoverage
      - VellisRequirements::mcpAgentToolContract
      - VellisRequirements::mcpOutcomeIntegrity
    alternatives:
      - Return every finding in one unbounded tool response.
      - Return a truncated result and require repeated full validation.
    reversible: true
    owner_work_item_id: W004
    evidence_intent:
      - One validation produces every finding once and records a complete count.
      - Bounded intervals retrieve the complete ordered set without revalidation.
      - Activation accepts only the exact current conforming prospective assessment.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_sqlite_prospective_state.py tests/vellis/test_definition_governance.py tests/vellis/test_current_work.py tests/vellis/test_graph_queries.py tests/vellis/test_graph_changes.py tests/vellis/test_store_integrity.py
  - id: D006
    summary: Production operations never construct or retain a complete Graph, CanonicalState, or definition-set aggregate.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::boundedHistoricalSelectionWork
      - VellisRequirements::replayEquivalence
    alternatives:
      - Permit explicit whole-state materializers outside routine calls.
      - Retain whole-state materializers only for snapshot, replay, and restore.
    reversible: false
    owner_work_item_id: W006
    evidence_intent:
      - Ordinary mutation work is bounded by the change and affected invariant neighborhood.
      - Whole-state assessment uses set-based or bounded streaming work.
      - Snapshot, replay, restore, and import use streams or temporary durable state.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/vellis/test_current_work.py tests/vellis/test_mcp_boundary.py tests/vellis/test_v1_streaming.py tests/vellis/test_streaming_lifecycle.py tests/vellis/test_work_characterization.py tests/vellis/test_store_integrity.py
