  - {id: F016, summary: "The clean W001 review pair is not durably attributable outside the conversation.", classification: plan gap, consequence: "A cold agent cannot reconstruct the reviewer identities, lenses, dispositions, and shared token that justified the approval checkpoint.", authority_refs: [AGENTS.md], evidence_refs: [path:docs/semantic-work-locality-handoff.md#semantic-work-locality-implementation-handoff, command:just check], disposition: resolved, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "A checkpoint is marked reviewed without durable reviewer and token attribution.", compatibility_effect: "No system behavior changes; the W001 review record retains both clean reviewer identities, lenses, shared token, proposed checkpoint, model digest, and passed checks."}
  - {id: F017, summary: "The selected query dataclasses accept contradictory or removed MCP members through defaulted discriminators and open request objects.", classification: plan gap, consequence: "Malformed input can silently select another state or output, discard contradictory fields, or partly translate an old request.", authority_refs: [RTG::'Evaluated State Selection', RTG::'Query Output', VellisRequirements::mcpOutcomeIntegrity], evidence_refs: [path:docs/semantic-work-locality-handoff.md#public-contract-and-analyzer], disposition: resolved, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "Tagged unions exist in type hints while Pydantic union ordering and ignored extra fields still choose a different meaning.", compatibility_effect: "Every query request object is closed to extra members, and explicit state/output variants also require a discriminator."}
  - {id: F018, summary: "Definition summary, inspection, and proposal discovery can combine statements from different committed revisions.", classification: implementation defect, consequence: "A read can report a revision and delta state that never contained its returned definitions or assessment.", authority_refs: [VellisRequirements::historicalStateCorrectness, VellisRequirements::agentDefinitionDiscoverability], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_semantic_work_locality_triggers.py#test_definition_summary_uses_one_committed_snapshot, path:tests/vellis/test_semantic_work_locality_triggers.py#test_definition_inspection_source_uses_one_committed_snapshot, path:tests/vellis/test_semantic_work_locality_triggers.py#test_proposal_discovery_uses_one_committed_snapshot], disposition: resolved, owner_work_item_id: W003, implementation_status: conforming, nearest_wrong_system: "State selection is unified while related discovery statements still run outside one SQLite snapshot.", compatibility_effect: "Discovery results become linearizable without changing their payload meaning."}
  - {id: F019, summary: "Assessment paging can combine an old publication header with findings removed by a concurrent replacement.", classification: implementation defect, consequence: "A bounded interval can report a positive finding count while returning no findings from an impossible publication state.", authority_refs: [RTGSystem::'Assess graph conformance'], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_semantic_work_locality_triggers.py#test_assessment_page_trigger_reproduces_mixed_publication], disposition: implementation-work, owner_work_item_id: W006, implementation_status: conflicting, nearest_wrong_system: "Each assessment query is correct alone but the interval has no shared read snapshot.", compatibility_effect: "Assessment intervals return one complete old or new publication."}
  - {id: F020, summary: "Successful assessment and restore operations retain population-sized temporary work rows until reuse or connection close.", classification: implementation defect, consequence: "A long-lived server retains an equivalent whole-population materialization between invocations.", authority_refs: [VellisRequirements::historyIndependentCurrentWork, VellisRequirements::historicalRestoreSemantics], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_semantic_work_locality_triggers.py#test_successful_assessment_and_restore_retain_population_work_rows], disposition: implementation-work, owner_work_item_id: W006, implementation_status: conflicting, nearest_wrong_system: "Temporary table definitions are reusable but their completed-operation populations remain resident.", compatibility_effect: "Assessment and restore semantics remain unchanged while transient rows are cleared on every exit."}
  - {id: F021, summary: "The proposed tree and connected-only restrictions reject valid must-exist pattern topologies.", classification: model gap, consequence: "The language can no longer express ordinary conjunctions such as disconnected existence gates or one named X managing and mentoring the same named Y.", authority_refs: [RTG::'Graph Query', VellisRequirements::semanticQueryMeaning], evidence_refs: [path:docs/semantic-work-locality-handoff.md#compiler-and-conjunctive-answer-relation], disposition: accepted, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "Physical work-locality concerns are enforced as public topology restrictions.", compatibility_effect: "Disconnected, parallel, self-link, and cyclic finite positive patterns remain valid."}
  - {id: F022, summary: "The query comparison vocabulary omits owner-required regular-expression filtering of string data.", classification: model gap, consequence: "A named data selector cannot express a must-exist string pattern and must over-return values for client-side filtering.", authority_refs: [RTG::'Property Comparison', VellisRequirements::semanticQueryMeaning, VellisRequirements::stringPatternValidation], evidence_refs: [path:docs/semantic-work-locality-handoff.md#public-contract-and-analyzer], disposition: accepted, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "The structural query reset succeeds while lower-level data constraints remain less expressive than the owner's pattern model.", compatibility_effect: "matchesPattern adds RE2 Unicode whole-string filtering for present string properties without a general expression language."}
  - {id: F023, summary: "The selected compiled-capacity plan does not inventory every SQLite limit exercised by generated statements, parameters, and temporary rows.", classification: plan gap, consequence: "Deterministic structural excess can surface as untyped SQL-too-big, recursion, or preparation-memory failures instead of the planned whole-result refusal.", authority_refs: [VellisRequirements::querySafety], evidence_refs: [path:docs/semantic-work-locality-handoff.md#exact-capacity-and-preparation], disposition: resolved, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "A longer list of manual counts replaces the old formula while parameter/row length and preparation-only parser or VDBE limits remain unclassified.", compatibility_effect: "No query meaning changes; W003 inventories, avoids, or probes every relevant active limit and distinguishes deterministic refusal from genuine execution failure."}
  - {id: F024, summary: "The query plan lacks decisive work-locality evidence for non-sargable matchesPattern comparisons.", classification: plan gap, consequence: "Answers can be correct while RE2 work scans unrelated objects carrying the same property name and kind.", authority_refs: [VellisRequirements::querySafety, VellisRequirements::stringPatternValidation], evidence_refs: [path:docs/semantic-work-locality-handoff.md#compiler-and-conjunctive-answer-relation, path:docs/semantic-work-locality-handoff.md#verification-matrix], disposition: resolved, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "Generic unrelated-population evidence passes while regex evaluation still grows with property rows outside the selector's association candidates.", compatibility_effect: "No query meaning changes; W003 ties regex calls and property visits to relevant candidates without prescribing physical predicate order."}
  - {id: F025, summary: "Canonical json_equal now constructs complete recursive keys and loses structural short-circuiting.", classification: implementation defect, consequence: "Cheap kind or early-member mismatches perform full nested traversal per graph comparison and per SQLite equality-predicate row.", authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::querySafety], evidence_refs: [path:tests/vellis/test_canonical_equality.py#test_structural_json_equality_short_circuits_before_later_members], disposition: resolved, owner_work_item_id: W003, implementation_status: conforming, nearest_wrong_system: "Set/counter keys become the only equality algorithm and make mismatches cost the same traversal as matches.", compatibility_effect: "No equality meaning changes; structural equality short-circuits while collection operations retain canonical keys."}
  - {id: F026, summary: "Graph property validation rebuilds one permitted-value key set for every validated object value.", classification: implementation defect, consequence: "Validating N objects against K permitted values performs N times K key construction instead of one index plus N lookups.", authority_refs: [VellisRequirements::canonicalSemanticEquality, VellisRequirements::historyIndependentCurrentWork], evidence_refs: [path:tests/vellis/test_canonical_equality.py#test_graph_validation_prepares_one_permitted_index_per_constraint_scope, path:tests/vellis/test_canonical_equality.py#test_permitted_value_membership_uses_recursive_canonical_equality], disposition: resolved, owner_work_item_id: W007, implementation_status: conforming, nearest_wrong_system: "Pairwise definition validation is removed while the same permitted collection is rebuilt for every governed graph value.", compatibility_effect: "No validation or equality result changes; one prepared permitted-value index is reused for its validation scope."}
  - {id: F027, summary: "Complete-return screening omits projected-property source identity and value content.", classification: implementation defect, consequence: "A property-only result can be observed as accepted before its unencodable source UUID or nested value fails at the MCP boundary.", authority_refs: [VellisRequirements::querySafety, VellisRequirements::mcpOutcomeIntegrity], evidence_refs: [path:tests/vellis/test_invalid_queries.py#test_no_field_of_a_returned_property_escapes_the_completeness_screen, path:tests/vellis/test_invalid_queries.py#test_production_property_return_screen_walks_source_and_nested_value, path:tests/vellis/test_invalid_queries.py#test_complete_return_refusal_is_observed_before_the_result_leaves_the_system], disposition: resolved, owner_work_item_id: W003, implementation_status: conforming, nearest_wrong_system: "Object projections are screened completely while the new source-preserving property projection bypasses the same whole-result guard.", compatibility_effect: "No valid query answer changes; unencodable property rows receive typed whole-result refusal before observation."}
