findings:
  - id: F001
    summary: Tail replay does not bind each prospective-definition edit to its claimed proposal identity.
    classification: implementation defect
    consequence: A self-consistent definition-delta transition can stage different definition meaning than its resulting state identity claims and still be accepted when a later record discards the evidence.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::replayEquivalence
      - VellisRequirements::canonicalSemanticEquality
      - VellisVerification::invalidTail
    evidence_refs:
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_a_proposal_identity_mismatch_hidden_by_later_discard
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Tail lineage and final state are valid, but an intermediate proposal record claims a definition identity not produced by its own events.
    compatibility_effect: Correct native tails remain unchanged; malformed unreleased tails are refused earlier.
  - id: F002
    summary: Tail replay validates graph conformance only after the final transition.
    classification: implementation defect
    consequence: An invalid active graph transition can be accepted when a later transition repairs it, despite every canonical revision being required to establish valid state.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::replayEquivalence
      - VellisRequirements::historyIndependentCurrentWork
      - VellisVerification::invalidTail
    evidence_refs:
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_an_invalid_active_revision_hidden_by_later_repair
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The reconstructed final graph conforms, but one intermediate canonical revision uses unknown types or violates another graph invariant.
    compatibility_effect: Correct native tails remain unchanged; malformed unreleased tails are refused earlier.
  - id: F003
    summary: Tail activation does not revalidate the staged proposal against its current active base.
    classification: implementation defect
    consequence: A proposal made stale by an intervening active change can be activated during replay even though live operation would refuse that transition.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::replayEquivalence
      - VellisRequirements::nonDisruptiveDefinitionWork
      - VellisVerification::invalidTail
    evidence_refs:
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_activation_after_its_staged_base_became_stale
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Activation events equal the staged overlay and produce a conforming final state, but the overlay no longer applies to the active values it was staged against.
    compatibility_effect: Correct native tails remain unchanged; stale activation transitions are refused.
decisions:
  - id: D001
    summary: Validate each reconstructed transition from maintained proposal summaries, affected-neighborhood graph checks, and state-wide activation or restoration checks.
    authority_refs:
      - VellisRequirements::replayEquivalence
      - VellisRequirements::historyIndependentCurrentWork
      - VellisRequirements::canonicalSemanticEquality
    alternatives:
      - Validate only the final reconstructed state.
      - Run a complete graph assessment after every tail record.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - A proposal mismatch masked by discard is rejected.
      - An invalid local graph mutation masked by a later repair is rejected.
      - Local graph-transition validation remains independent of unrelated graph population.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_a_proposal_identity_mismatch_hidden_by_later_discard
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_an_invalid_active_revision_hidden_by_later_repair
      - path:tests/vellis/test_streaming_lifecycle.py#test_tail_rejects_activation_after_its_staged_base_became_stale
      - path:tests/vellis/test_population_local_work.py#test_one_tail_record_adds_bounded_vm_work_over_the_snapshot_import
