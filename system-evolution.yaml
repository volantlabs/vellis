    - Reducing tests to a numerical target or deleting distinct boundary and failure evidence.
findings:
  - id: F001
    summary: The prior evolution closed a whole-suite subtraction claim after changing only six test files and removing nine collected cases.
    classification: plan gap
    consequence: The durable record says all retained cases have unique discriminating value although the largest suites were not audited at claim level.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - command:just system-evolution-check
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A green suite and closed ledger are treated as proof that every retained case is necessary.
    compatibility_effect: Correcting the record changes no product behavior.
  - id: F002
    summary: A checkpointed campaign worker result does not bind both review lenses to the exact reviewed state token.
    classification: implementation defect
    consequence: A thin manager can accept one reported pair without recording distinct reviewer identifiers, lens disposition, shared state, or equality with current durable state.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_unbound_review_pairs
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_a_stale_expected_state_token
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Two clean reviews inspect different or stale states while the compact result still authorizes checkpointing.
    compatibility_effect: The compact internal worker-result contract gains review bindings; product interfaces are unchanged.
  - id: F003
    summary: Removing the literal current-graph SQL guard left no equivalent coverage of unexercised literal query paths.
    classification: implementation defect
    consequence: A new unbounded literal projection scan on an unexercised ordinary path can pass runtime characterization.
    authority_refs:
      - VellisRequirements::historyIndependentCurrentWork
      - VellisVerification::currentWorkScaling
    evidence_refs:
      - path:tests/vellis/test_population_local_work.py#test_every_literal_current_graph_read_is_bounded_or_selected_state_wide
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: An ordinary literal query scans the complete current graph but returns a correct answer on every exercised scenario.
    compatibility_effect: SQLite realization-integrity evidence changes; product behavior is unchanged.
  - id: F004
    summary: Canonical equality, definition discovery, and campaign validation contain reconstructible duplicate claims or setup.
    classification: plan gap
    consequence: Repeated cases in these selected groups add context and maintenance cost without rejecting another wrong system.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - command:uv run pytest tests/vellis/test_canonical_equality.py tests/vellis/test_definition_discovery.py tests/vellis/test_population_local_work.py -q
      - command:uv run pytest tests/test_implementation_campaign.py -q
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Several tests reject the same failure through duplicated fixtures while distinct cases are retained only by inertia.
    compatibility_effect: Only test realization and repository validation change.
decisions:
  - id: D001
    summary: Audit explicit claim-equivalence groups in canonical equality, definition discovery, and campaign validation while leaving other suites unclaimed.
    authority_refs:
      - AGENTS.md
    alternatives:
      - Preserve the remaining suite by default.
      - Delete tests by file size or count.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Each audited group names the distinct wrong system or workflow transition retained cases reject.
      - Repeated setup and parameter axes are consolidated without erasing distinct boundaries.
      - The durable record names unaudited scope instead of implying universal retention value.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_canonical_equality.py#test_every_graph_discriminator_participates_in_equality
      - path:tests/vellis/test_canonical_equality.py#test_every_definition_discriminator_participates_in_equality
      - path:tests/vellis/test_definition_discovery.py#test_discovery_neither_changes_state_nor_reads_canonical_history
      - path:tests/test_implementation_campaign.py#test_a_slice_finished_since_the_renewal_binds_cleanly_under_the_renewed_plan
  - id: D002
    summary: A checkpointed worker result carries one exact review state token and two distinct clean lens records tied to it.
    authority_refs:
      - AGENTS.md
    alternatives:
      - Trust an aggregate pair count.
      - Restore a redundant unconditional second pair.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Missing, duplicate, non-clean, or mismatched review bindings reject checkpointing.
      - Mutation changes the state token and invalidates the result.
      - The live campaign/work item and approved-plan checkpoint format bind the transition; all reported checks are passed.
    implementation_status: conforming
    evidence_refs:
      - path:tests/test_implementation_campaign.py#test_review_frames_are_lens_specific_and_contain_no_review_history
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_unbound_review_pairs
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_a_stale_expected_state_token
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_a_changed_current_state_token
      - path:tests/test_implementation_campaign.py#test_state_token_invalidates_clean_review_state_after_tracked_mutation
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_rejects_the_wrong_transition
      - path:tests/test_implementation_campaign.py#test_checkpointed_worker_result_binds_checkpoint_to_work_item_and_approved_plan
