    wrong_behavior: The lock still resolves a pypdf below 6.21.4, or resolves anything other than the reviewed lockfile.
    evidence_ref: command:just system-evolution-check
  - id: A2
    wrong_behavior: The new major version changes the reader, writer or outline API the reference tool uses, so outline
      flattening or page extraction fails.
    evidence_ref: command:uv run pytest tests/test_sysml_reference.py
  compatibility_effect: Development toolchain only. The installed Vellis package, its runtime dependencies, tools,
    wire, and database are unchanged. The regenerated specification corpus carries the F002 consequences.
  non_effects:
