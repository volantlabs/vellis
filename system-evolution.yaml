      - path:model/50-verification.sysml
    blocker: null
    checkpoint: git:218bc71
  - id: W002
    order: 2
    label: Make historical selection physically honor existing bounds
    kind: implementation
    dependencies: []
    planned_baseline: git:e82e0e6817c67a76c21d4d4a29c8d7cf70203a86
    finding_ids:
