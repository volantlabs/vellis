schema_version: "1.0"
evolution:
  id: vellis-2-prerelease-remediation
  objective: Formalize accepted obligations and restore semantic, observational, compatibility, and installable release integrity for Vellis 2.0.
  observable_distinction: Requirements and objectives constrain their prose, query bounds use semantic JSON equality, required observations cannot disappear behind completed results, and installed Vellis preserves snapshot recovery.
  lifecycle: active
  approval:
    status: accepted
    reason: The approved plan must be bound to a durable awaiting-approval checkpoint before execution.
    checkpoint: git:90daeb0effc79e9a9a8ab8bfa64d8f701b5c15c0
  blocker: null
  checkpoint: git:80718765c5185f586c586cf0d2d82bbb69d6ca9a
