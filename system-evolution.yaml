schema_version: '1.0'
evolution:
  id: vellis-2-pypdf-advisory-bump
  mode: copilot
  objective: Move the development-only pypdf dependency out of every open advisory range without silently degrading
    the specification search corpus it produces.
  observable_distinction: The locked pypdf is 7.0.1, outside all 29 open Dependabot advisory ranges (fixed at 6.21.4
    and earlier), and the regenerated specification corpus differs from the 6.16.1 rendering only in the recorded
    whitespace and word-join consequences.
  lifecycle: active
  approval:
    status: not-required
    reason: The change selects a development toolchain version. No model authority, product runtime dependency,
      external boundary, or compatibility promise changes, and the reference tooling is not modeled.
    checkpoint: null
  blocker: null
  checkpoint: null
