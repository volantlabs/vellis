evolution:
  id: sqlite-write-path-resource-review
  objective: Make every Vellis operation use bounded local, set-based, or streaming work without constructing complete resident graph or canonical-state aggregates.
  observable_distinction: Ordinary work touches only its affected semantic neighborhood, complete assessments remain exhaustive through bounded retrieval, and lifecycle operations stream complete meaning without resident whole-state values.
  lifecycle: complete
  approval:
    status: accepted
    reason: The owner accepted normalized SQLite state, prospective graph overlay, complete stored assessments with bounded retrieval, and streamed snapshots while preserving portable system meaning.
    checkpoint: git:8109ab24c4dc58d81fbfe2fee0181b395089a61d
  blocker: null
  checkpoint: git:d59d3c084d71275186d87b685403571f829cd54c
