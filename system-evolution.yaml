findings:
  - id: F001
    summary: The only documented install command referenced a wheel that no repository command produced, and no check ever ran it.
    classification: implementation defect
    consequence: A person or agent following README.md could not install Vellis at all, and the installed-boundary proof VellisVerification::mcpLifecycle requires was only exercised through package_smoke's own ad hoc build, never through the publicly documented command.
    authority_refs: [VellisRequirements::simpleOperation, VellisVerification::mcpLifecycle]
    evidence_refs: [path:tests/test_repository_policy.py#test_documented_subcommands_match_the_owner_command, path:README.md#install, path:docs/install.md#troubleshooting]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A README install command that references a nonexistent artifact, or a regression guard that hardcodes its own copy of that command instead of parsing README.md, would both silently diverge from what a user actually runs.
    compatibility_effect: No public tool, wire shape, or CLI subcommand changes; only install documentation and build tooling change.
  - id: F002
    summary: package_smoke.py held its own unguarded VERSION literal instead of reading pyproject.toml.
    classification: implementation defect
    consequence: A version bump that updated pyproject.toml, vellis/__init__.py, and the policy test literal could still leave package_smoke silently smoke-testing under a stale expected version.
    authority_refs: [VellisVerification::mcpLifecycle]
    evidence_refs: [command:just package-check]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A wheel built at a new version still passes package_smoke's installed-import assertion because its expected VERSION literal was never bumped alongside it.
    compatibility_effect: No product effect; only the smoke test's own version comparison source changes.
  - id: F003
    summary: The noninteractive --connect error omitted the valid 'both' choice.
    classification: implementation defect
    consequence: An agent following the named remedy would believe only codex or claude were valid --connect values, when both is also accepted.
    authority_refs: [VellisRequirements::simpleOperation]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_noninteractive_connect_error_names_every_valid_client]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: An error message names a remedy that is itself incomplete, leading an unattended agent to retry with an incomplete command.
    compatibility_effect: No behavior change; only the error message text.
  - id: F004
    summary: The install-check's isolation precondition was tautologically true by construction and never inspected the environment values reaching the subprocess.
    classification: implementation defect
    consequence: A future refactor that dropped the UV_TOOL_DIR/UV_TOOL_BIN_DIR override could silently install into the operator's real ~/.local/share/uv/tools and ~/.local/bin while the guard still reported clean.
    authority_refs: [VellisVerification::mcpLifecycle]
    evidence_refs: [path:tests/test_package_smoke.py#test_run_isolated_tool_rejects_environment_outside_temp_root, path:tests/test_package_smoke.py#test_run_isolated_tool_rejects_missing_overrides]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The guard compares two Path objects that are nested by construction one line above it, so it can never fail regardless of what is actually passed as the subprocess environment.
    compatibility_effect: No product effect; the isolation check now lives inside the one function capable of running a tool-install command, and re-verifies on every call.
  - id: F005
    summary: README's clone-and-run contributor path was never parsed or executed by the install check.
    classification: implementation defect
    consequence: A broken contributor path, such as a typo in uv sync, would leave just package-check green.
    authority_refs: [VellisRequirements::simpleOperation, VellisVerification::mcpLifecycle]
    evidence_refs: [command:just package-check]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Two of three documented install paths are exercised while the third silently rots.
    compatibility_effect: No product effect; the check now clones, syncs, and runs against committed HEAD.
  - id: F006
    summary: The noninteractive setup mode-selection error restated the rule without naming its remedy, and its first fix repeated F003's own defect by naming only two of the four valid flags.
    classification: implementation defect
    consequence: An unattended agent intending --from-v1 or --from-backup, having omitted the flag, was told only about --starter/--blank, an equally incomplete remedy to the one F003 fixed for --connect.
    authority_refs: [VellisRequirements::initialization, VellisRequirements::starter]
    evidence_refs: [path:tests/vellis/test_mcp_lifecycle_v2.py#test_noninteractive_setup_mode_error_names_every_valid_flag]
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The message correctly enforces VellisRequirements::initialization's explicit-choice obligation but names only some of the flags that satisfy it, leaving an agent using an unnamed one to guess.
    compatibility_effect: No behavior change; only the error message text, which now names all four modes.
decisions:
  - id: D001
    summary: Derive the tested install command from README.md's own Install section rather than duplicating it in package_smoke.py.
    authority_refs: [VellisVerification::mcpLifecycle]
    alternatives: [Hardcode a second copy of the install command in the smoke test., Add a separate install-check tool and just recipe., Trust the README without any automated check.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [A renamed or missing Install heading fails the check., A command that no longer names the canonical repository URL fails the check., A genuinely broken install flag fails the check., The real UV_TOOL_DIR and UV_TOOL_BIN_DIR remain untouched by the check.]
    implementation_status: conforming
    evidence_refs: [command:just package-check]
  - id: D002
    summary: Read package_smoke's expected VERSION from pyproject.toml via tomllib instead of a hardcoded literal.
    authority_refs: [VellisVerification::mcpLifecycle]
    alternatives: [Import vellis.__version__ directly., Leave the literal duplicated and rely on manual discipline.]
    reversible: true
    owner_work_item_id: W001
    evidence_intent: [package_smoke's expected version always matches pyproject.toml without a separate edit.]
    implementation_status: conforming
    evidence_refs: [command:just package-check]
