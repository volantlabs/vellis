schema_version: "1.0"
evolution:
  id: vellis-2-agent-usable-boundary
  objective: Make the MCP boundary usable by a conforming client doing real agent work, so that every selected tool can actually receive its arguments and an incremental graph load never fails a cardinality count the change could not affect.
  observable_distinction: A conforming MCP client can call rtg_validate and rtg_draft_inspect with their fresh and continuation arguments and receive the selected payload instead of an input-validation refusal, and attaching new children to an existing parent under a minimum-one links-per-source type is accepted instead of rejected with a cardinalityViolation naming the untouched parent.
  lifecycle: active
  approval:
    status: not-required
    reason: RTG014 already requires the selected behaviors to be exposed through ordinary typed JSON values, and RTG003 already requires each count to apply to the complete permitted population of that exact one type. Both findings are implementation defects under sufficient accepted authority.
    checkpoint: null
  blocker: null
  checkpoint: null
