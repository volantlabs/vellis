schema_version: "1.0"
evolution:
  id: callable-tool-surface-and-value-fidelity
  objective: Close the callable-tool and scale-simulation findings so queries preserve one meaning across realizations and request generations, clean close reports checkpoint contention, and owner guidance matches the runnable surface.
  observable_distinction: Discovery returns ten self-contained input schemas, stored JSON kinds remain exact, aggregate-only queries agree between durable and in-memory evaluation, former single-type MCP requests remain callable, a clean close either consolidates the WAL or reports the reader preventing it, restoration is documented, patterned dates are queryable, and orphaning definition edits are refused.
  lifecycle: active
  approval:
    status: pending
    reason: The owner must seal the modeling correction that resolves contradictory aggregation-only query authority before closure.
    checkpoint: null
  blocker: null
  checkpoint: null
