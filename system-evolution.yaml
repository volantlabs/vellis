    - engineering and evidence
  non_goals:
    - Changing the ten selected tool names or their authorization boundary.
    - Changing persistence formats or canonical stored meaning.
    - Constraining a stored property value more tightly than the owner's own definitions do.
    - Replacing definitions that are capable of being written out with a permissive value.
    - Adding native aggregation over anchor groups or changing query result semantics.
findings:
  - id: F001
    summary: The three request types carrying a stored JSON value publish a definitions block and an unresolved reference instead of an inlined request schema.
    classification: implementation defect
    consequence: A client that does not resolve references sees an untyped parameter for rtg_query, rtg_change, and rtg_set_definition_delta, sends each request as text, and is refused as malformed, so both write tools and the query tool cannot be called at all.
    authority_refs:
      - VellisRequirements::mcpAgentToolContract
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_published_input_schemas_carry_their_whole_meaning
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Every tool body and every validation behaves correctly while three of the ten tools are unreachable through core discovery and invocation.
    compatibility_effect: Published input schemas gain inlined meaning; accepted requests, refusals, and results are unchanged.
  - id: F002
    summary: Boundary evidence passed prepared dictionaries to every tool and never consulted a published input schema.
    classification: plan gap
    consequence: A schema that says nothing about its request passes the whole boundary suite, so the contract's usability obligation had no discriminating evidence.
    authority_refs:
      - VellisRequirements::mcpAgentToolContract
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_published_input_schemas_carry_their_whole_meaning
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The boundary suite is green because it exercises the server directly and never reads what a caller would be told.
    compatibility_effect: Test evidence only; no product behavior changes.
  - id: F003
    summary: Evolution workflow tests selected work items and findings from the live record by hardcoded identifier.
    classification: implementation defect
    consequence: Opening any evolution whose work items or findings are named differently fails six validator tests that assert nothing about names, so the durable record's inventory is frozen by its own tooling.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py -q
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Validator rules are correct while the suite fails for the sole reason that the current evolution named its work differently.
    compatibility_effect: Test realization only; the record schema and validator rules are unchanged.
  - id: F004
    summary: A stored JSON value arriving through a tool had its kind decided by union order, so the numbers one and zero were read as Booleans.
    classification: implementation defect
    consequence: A declared number property refuses a legitimate 1, and inside an array or object no declaration reaches the member, so 1 and 0 are committed to canonical state as true and false with no finding and no way for the owner to notice.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_a_stored_value_keeps_the_json_kind_the_caller_sent
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Every operation reports success while the owner's ones and zeros are silently rewritten into Booleans in canonical state.
    compatibility_effect: A value now keeps the kind its caller sent; no stored form, comparison, or result shape changes.
  - id: F005
    summary: A multiplicity finding named its constrained end by rendering the enumeration member, so owner-facing text read 'DirectAssociationEnd.ASSOCIATED_DATA'.
    classification: implementation defect
    consequence: A finding an owner reads carries a realization detail beside type keys that are already their modeled names, so the one part they cannot look up is the one the system invented.
    authority_refs:
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_definition_validity.py#test_a_multiplicity_label_names_its_end_in_the_model_s_own_words
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Findings are correct and complete while naming their subject in a vocabulary the model never defined.
    compatibility_effect: Label text changes; finding identity, ordering, and validation are unchanged.
  - id: F006
    summary: A refused activation reported only that the assessment was missing, stale, or nonconforming.
    classification: implementation defect
    consequence: The caller's next move differs by reason, so one message covering all of them forces another assessment to learn what the refusal already knew.
    authority_refs:
      - VellisRequirements::mcpOutcomeIntegrity
      - VellisRequirements::observableFailure
    evidence_refs:
      - path:tests/vellis/test_definition_governance.py#test_a_refused_activation_says_which_of_the_reasons_it_was
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A correct refusal leaves the caller unable to tell repair-the-proposal from assess-it-again.
    compatibility_effect: Refusal text becomes specific; the refusal itself and its non-effect are unchanged.
  - id: F007
    summary: A canonical history entry with no stored summary fell back to naming its stored transition key and revision.
    classification: implementation defect
    consequence: An owner reviewing their own memory reads 'graphMutation to revision 3', which names a realization key rather than saying what happened.
    authority_refs:
      - VellisRequirements::boundedHistoryRead
    evidence_refs:
      - path:tests/vellis/test_activity_history.py#test_a_canonical_entry_says_what_happened_in_the_model_s_own_words
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: History is complete and durable while telling its owner nothing they can read.
    compatibility_effect: Fallback summary text changes; no ledger row, ordering, or replay authority changes.
  - id: F008
    summary: The Everyday Life starter models every date as a patterned string while ordered comparison is valid only for number-valued properties, so no date-range question can be asked.
    classification: model gap
    consequence: An owner cannot ask what is due before a date, and the only workaround is to read every task and filter outside the system, which is the unbounded read the query bound exists to prevent.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
      - VellisRequirements::stringPatternValidation
      - EverydayLifeStarter
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_a_string_property_orders_by_code_point
      - path:tests/vellis/test_graph_queries.py#test_string_ordering_agrees_between_the_stored_and_replayed_graph
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: Every bound is honoured while the most common question about a task list can only be answered by defeating them.
    compatibility_effect: Ordered comparison now accepts string-valued properties by code point. No stored value, definition, or existing result changes; a query that was refused is now answered, and none that was answered changes its rows.
  - id: F009
    summary: Campaign evidence lookup located its commit by exact record match, including the observed baseline that is meant to track the repository.
    classification: implementation defect
    consequence: Updating the observed baseline after a model change, which is the only correct response to one, drops evidence lookup back to the closure commit where evidence renamed since then no longer resolves, so the record can be validated only after committing the change being validated.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - path:tests/test_implementation_campaign.py#test_evidence_lookup_survives_updating_the_baseline_that_tracks_the_repository
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A completed campaign is reported as having unresolvable evidence purely because its repository-tracking baseline was brought up to date.
    compatibility_effect: Evidence lookup ignores one drifting field when matching; which commit closed a campaign, and every evidence rule, are unchanged.
  - id: F010
    summary: After any definition activation, the delta assessment stops reporting dangling type references created by a later removal, and reports the proposal as conforming.
    classification: implementation defect
    consequence: An owner removing a type that other definitions still name is told the proposal conforms and may activate it, installing an active vocabulary that the system's own definition validation rejects. The safety net is present on a fresh system and absent on every system past its first vocabulary change.
    authority_refs:
      - VellisRequirements::validationCoverage
      - VellisRequirements::nonDisruptiveDefinitionWork
    evidence_refs:
      - path:tests/vellis/test_definition_governance.py#test_a_removal_that_orphans_a_reference_is_refused_after_an_earlier_activation
      - path:tests/vellis/test_definition_governance.py#test_a_removal_that_orphans_a_multiplicity_rule_is_refused_after_an_activation
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Definition governance refuses an inconsistent removal exactly once, on a system that has never changed its vocabulary, and silently permits it forever after.
    compatibility_effect: Proposals previously reported as conforming are now correctly refused. No stored definition, graph object, or ledger record changes, and assessment work stays bounded to the closure of what the edit touched.
  - id: F011
    summary: A projection deduplicates identical tuples, so an agent totalling projected values silently answers a smaller question.
    classification: model gap
    consequence: Summing a projected category and amount over 1,460 transactions read 752 rows and returned exactly zero for every category, a plausible answer that is wrong, with nothing in the result indicating the collapse.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_aggregation_counts_matching_objects_not_distinct_projected_tuples
      - path:tests/vellis/test_graph_queries.py#test_aggregation_agrees_between_the_stored_and_in_memory_graph
      - path:tests/vellis/test_graph_queries.py#test_in_memory_aggregation_stops_when_the_maximum_is_decided
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Every row is correct and every total computed from them is wrong, in a way that reads as a real answer.
    compatibility_effect: Deduplication is unchanged. Aggregation is added beside it and reads matches, so a caller has a way to ask the question they meant.
  - id: F012
    summary: An anchor group named exactly one type, so a question about work of several shapes needed one query per shape.
    classification: model gap
    consequence: As a vocabulary grows the cost of any cross-type question grows with it, and the caller must merge results the system could have joined.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_an_anchor_group_may_name_several_types
      - path:tests/vellis/test_mcp_boundary.py#test_the_former_single_anchor_type_spelling_remains_callable
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: A caller merges per-type results by hand and silently omits a type the vocabulary gained since they wrote the query.
    compatibility_effect: A group now names one or more types; the former scalar wire spelling remains accepted as the same singleton group while discovery and returned queries use the canonical collection.
  - id: F013
    summary: Historical restoration was modelled, implemented, and covered by twenty tests, with no path by which any owner or agent could invoke it.
    classification: implementation defect
    consequence: An owner whose memory is damaged can read the history that shows it and has no way to act on it, while a working, tested recovery capability sits unreachable.
    authority_refs:
      - RTGSystem
      - VellisRequirements::historicalRestoreSemantics
    evidence_refs:
      - path:tests/vellis/test_historical_restore.py#test_the_owner_can_reach_restoration_from_the_command_line
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The safety net exists, is tested, and cannot be reached by the person it protects.
    compatibility_effect: The agent surface stays at exactly ten tools; restoration becomes an owner command that confirms before acting.
  - id: F014
    summary: Committed state remained in the write-ahead log, so copying the store file produced a coherent but silently older memory.
    classification: implementation defect
    consequence: A copy of the store file was two revisions behind the live memory and still held a proposal that had already been activated, with nothing to indicate it was not current.
    authority_refs:
      - VellisRequirements::durableCanonicalHistory
    evidence_refs:
      - path:tests/vellis/test_store_integrity.py#test_close_reports_a_reader_that_prevents_a_complete_checkpoint
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: An owner keeps a backup of their memory that is quietly a snapshot of a different day.
    compatibility_effect: A clean close leaves the store wholly in its named file; a reader that prevents that guarantee now makes close fail with a corrective action instead of silently reporting success.
  - id: F015
    summary: An accepted approval must name a checkpoint whose own record already shows it accepted, so the first such record can never be written.
    classification: implementation defect
    consequence: The accepted approval state is unreachable. An owner's acceptance of a model change cannot be sealed durably, so a record that needs one stays pending however the work actually went, and no evolution in this repository's history has ever recorded one.
    authority_refs:
      - AGENTS.md
    evidence_refs:
      - path:tests/test_system_evolution.py#test_an_accepted_approval_binds_to_a_checkpoint_that_had_the_decision_open
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: The workflow enforces owner acceptance rigorously and provides no way to record that it happened, so the rule is satisfied only by never using it.
    compatibility_effect: The accepted state becomes reachable. What a checkpoint must still show is that the decision was open and that its consequence has not changed since.
  - id: F016
    summary: Return Shape required at least one projection while Graph Query and the implementation permit a query containing only aggregations.
    classification: model gap
    consequence: Accepted authority described aggregation-only queries as both valid and impossible, so model conformance could not be assessed consistently and the in-memory evaluator pruned their result-bearing component.
    authority_refs:
      - RTG::'Return Shape'
      - RTG::'Graph Query'
      - VellisRequirements::querySafety
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_aggregation_agrees_between_the_stored_and_in_memory_graph
      - path:tests/vellis/test_graph_queries.py#test_in_memory_aggregation_stops_when_the_maximum_is_decided
      - command:just model-check
    disposition: resolved
    owner_work_item_id: W004
    implementation_status: conforming
    nearest_wrong_system: The durable evaluator returns a correct total while replayed graph evaluation returns zero, and both claim to realize the same accepted query.
    compatibility_effect: The corrected authority selects aggregation-only queries consistently with the Graph Query behavior already presented to the owner; no previously accepted query is refused or changes its result.
  - id: F017
    summary: SQL existence pruning returned no aggregate bindings when a disconnected non-result selector component had no satisfying assignment.
    classification: implementation defect
    consequence: A valid empty selection returned an accepted result missing every requested aggregate, while in-memory evaluation returned the required zero count and absent arithmetic values.
    authority_refs:
      - RTG::'Graph Query Result'
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_unsatisfied_disconnected_component_keeps_empty_aggregate_bindings
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Current, prospective, or historical SQL evaluation accepts an empty selection but omits the requested arithmetic answers, while replayed graph evaluation returns them.
    compatibility_effect: Accepted empty selections now include one canonical zero/absent binding for every requested aggregation; nonempty results and rejected queries are unchanged.
  - id: F018
    summary: SQL evaluation computed aggregate bindings for a nonempty mixed projection-plus-aggregation query and then omitted them from the accepted result.
    classification: implementation defect
    consequence: A caller received the requested rows but none of the requested arithmetic answers, while in-memory evaluation of the same accepted query returned both parts.
    authority_refs:
      - RTG::'Graph Query Result'
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_aggregation_agrees_between_the_stored_and_in_memory_graph
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Durable evaluation accepts a mixed query and returns its projected objects while silently discarding every aggregate it already computed.
    compatibility_effect: Nonempty mixed results now include exactly the aggregate bindings the query requested; projected rows and aggregation-only results are unchanged.
  - id: F019
    summary: A checkpoint failure raised from close in an owner-facing finally block could replace a structured setup, serve, restore, or preserve outcome.
    classification: implementation defect
    consequence: A refused second setup surfaced as a raw StoreError, and an operation that had already committed could look wholly failed without saying that established memory changed.
    authority_refs:
      - VellisRequirements::simpleIndividualOperation
      - VellisRequirements::durableCanonicalHistory
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_setup_path.py#test_a_checkpoint_blocker_cannot_replace_a_second_start_report
      - path:tests/vellis/test_cleanup_boundaries.py#test_mcp_shutdown_reports_checkpoint_contention_without_recasting_commits
      - path:tests/vellis/test_cleanup_boundaries.py#test_restore_close_failure_names_the_committed_state_effect
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_close_failure_keeps_the_published_snapshot_truthful
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: The operation produces an accurate typed outcome, then cleanup contention erases it with a bare exception after any committed effect is already durable in the WAL.
    compatibility_effect: Cleanup contention is now staged and actionable at owner boundaries; successful and refused domain outcomes retain their true state effect, and clean shutdown behavior is unchanged.
  - id: F020
    summary: Aggregate sums used the process decimal context and rounded accepted exact numbers beyond 28 significant digits.
    classification: implementation defect
    consequence: A query returned a plausible but numerically different total for values the system had stored exactly, and both evaluators agreed on the same rounded error.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_sum_preserves_exact_numbers_beyond_the_decimal_context
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Durable and in-memory evaluation agree perfectly while both silently round a carry-sensitive total under the host process's default arithmetic context.
    compatibility_effect: Sum now preserves the exact mathematical value of every accepted decimal input; counts, minimum, maximum, selection, and stored values are unchanged.
  - id: F021
    summary: The accepted string-ordering work item still described its compatibility effect as unresolved, and the closure roll-up omitted the selected behavior.
    classification: plan gap
    consequence: The durable evolution record contradicted its accepted decision and conforming implementation, so a closure reader could not tell which compatibility effect had actually been selected.
    authority_refs:
      - AGENTS.md
      - VellisRequirements::semanticQueryMeaning
    evidence_refs:
      - command:just system-evolution-check
    disposition: resolved
    owner_work_item_id: W003
    implementation_status: conforming
    nearest_wrong_system: Product behavior and accepted model authority agree while the execution ledger continues to say the owner has not selected an approach.
    compatibility_effect: Record truth now names exact Unicode code-point ordering as the accepted additive behavior; product behavior is unchanged by this bookkeeping correction.
  - id: F022
    summary: Prospective multiplicity assessment enumerated active rules by the overlay set identity, dropping untouched rules inherited from its base after an activation.
    classification: implementation defect
    consequence: A prospective graph could violate an inherited upper bound, receive a conforming assessment, and become eligible for activation.
    authority_refs:
      - VellisRequirements::validationCoverage
      - VellisRequirements::nonDisruptiveDefinitionWork
    evidence_refs:
      - path:tests/vellis/test_definition_governance.py#test_an_inherited_multiplicity_rule_assesses_prospective_objects_after_activation
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Definition-reference validation reaches inherited rules correctly while final prospective graph conformance silently omits those same rules.
    compatibility_effect: Prospective assessments now enforce untouched inherited multiplicity rules; conforming proposals and active-state validation are unchanged.
  - id: F023
    summary: Exact aggregation still used Decimal construction at the implementation exponent boundary, so a finite accepted input pair could raise Overflow or InvalidOperation while forming its sum.
    classification: implementation defect
    consequence: Both evaluators crashed on a valid aggregate request instead of returning either an exact result or a whole typed refusal when the exact result was outside the finite result representation.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_sum_preserves_exact_numbers_at_the_decimal_exponent_boundary
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Exact coefficient arithmetic succeeds, then result construction raises at the representation boundary through both otherwise-agreeing evaluators.
    compatibility_effect: Representable sums remain exact; an exact sum outside the finite decimal result range is now refused whole with a typed finding instead of raising.
  - id: F024
    summary: Exact summation aligned widely separated exponents by materializing a power-of-ten coefficient before deciding whether the result was returnable.
    classification: implementation defect
    consequence: Two compact accepted numeric inputs could trigger population-sized allocation or MemoryError instead of a bounded whole-query refusal.
    authority_refs:
      - VellisRequirements::querySafety
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_sum_refuses_compact_inputs_that_require_population_sized_expansion
    disposition: resolved
    owner_work_item_id: W001
    implementation_status: conforming
    nearest_wrong_system: Match count stays within the caller's bound while two short exponent spellings cause unbounded transient coefficient materialization.
    compatibility_effect: Exact sums whose coefficient span is proportional to accepted input size remain unchanged; superlinear compact-input expansion is refused whole with a typed finding before allocation.
  - id: F025
    summary: The stdio MCP parser converted a high-precision fractional JSON number to binary float before Vellis could preserve its exact mathematical value.
    classification: implementation defect
    consequence: A caller could submit one exact JSON number and receive an accepted canonical mutation containing a different rounded number with no finding.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
      - VellisRequirements::mcpOutcomeIntegrity
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_raw_stdio_preserves_a_high_precision_fraction_in_both_directions
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: Prepared-dictionary tests preserve every apparent value while the production stdio decoder silently rounds a fractional token before the same request reaches them.
    compatibility_effect: Fractional JSON numbers retain their exact literal mathematical value through stdio input and output; integers, Booleans, schemas, tool names, and stored forms are unchanged.
  - id: F026
    summary: The public server command reported every ServeError as an open-memory failure with unchanged established memory, and its first correction overlooked activity-ledger changes from read-only sessions.
    classification: implementation defect
    consequence: An owner could be told the wrong failed stage or that memory was unchanged even though committed canonical or activity history had changed during the completed session.
    authority_refs:
      - VellisRequirements::simpleIndividualOperation
      - VellisRequirements::observableFailure
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_public_server_command_keeps_the_close_stage_and_state_effect
      - path:tests/vellis/test_cleanup_boundaries.py#test_mcp_shutdown_reports_whether_the_completed_session_changed_memory
      - path:tests/vellis/test_cleanup_boundaries.py#test_mcp_shutdown_counts_read_activity_as_a_changed_memory
      - path:tests/vellis/test_cleanup_boundaries.py#test_mcp_shutdown_reports_an_indeterminate_effect_when_final_position_is_unreadable
    disposition: resolved
    owner_work_item_id: W005
    implementation_status: conforming
    nearest_wrong_system: The server diagnoses close contention accurately while the owner-facing command rewrites it into a pre-service failure and a false non-effect.
    compatibility_effect: Serve failures gain their accurate stage and complete established-memory effect across canonical and activity history; clean serving, open failures, tool behavior, and canonical meaning are unchanged.
  - id: F027
    summary: Preservation checks an output name before capture, then publishes with unconditional replacement.
    classification: implementation defect
    consequence: A concurrently created file or dangling symbolic link can be overwritten after the preflight check even though the command promises never to write over an existing name.
    authority_refs:
      - Vellis::'Preserve personal memory snapshot'
      - VellisRequirements::ownerControlledMemory
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_never_replaces_a_concurrently_created_destination
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_refuses_a_dangling_symlink_before_observing_memory
    disposition: resolved
    owner_work_item_id: W006
    implementation_status: conforming
    nearest_wrong_system: Snapshot bytes are complete and valid while publication destroys another file that appeared during capture.
    compatibility_effect: Successful output is unchanged; publication now refuses every already-established destination name atomically.
  - id: F028
    summary: A preservation capture or write failure can suppress a simultaneous close and checkpoint failure, and observation reporting is assumed rather than measured.
    classification: implementation defect
    consequence: The owner may miss WAL copy-safety guidance or be told an activity record exists when failure occurred before snapshot observation.
    authority_refs:
      - Vellis::'Preserve personal memory snapshot'
      - VellisRequirements::observableFailure
      - VellisRequirements::durableCanonicalHistory
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_reports_capture_and_close_failures_together
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_reports_write_and_close_failures_together
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_failure_before_capture_does_not_claim_an_observation
      - path:tests/vellis/test_cleanup_boundaries.py#test_preserve_reports_an_indeterminate_activity_effect_when_position_is_unreadable
    disposition: resolved
    owner_work_item_id: W006
    implementation_status: conforming
    nearest_wrong_system: The primary failure is actionable while the secondary checkpoint failure and actual observational effect disappear.
    compatibility_effect: Failure output gains complete primary, cleanup, and measured activity effects; successful snapshots retain their existing content.
  - id: F029
    summary: A rejected restore is reported as an unchanged serve failure even though restoration appends an activity record.
    classification: implementation defect
    consequence: The owner receives the wrong operation name and a false state-effect claim after a normal semantic refusal.
    authority_refs:
      - Vellis::'Restore prior personal memory'
      - VellisRequirements::observableFailure
      - VellisRequirements::dualLedgerSeparation
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_rejected_restore_reports_restore_and_its_activity_effect
    disposition: resolved
    owner_work_item_id: W006
    implementation_status: conforming
    nearest_wrong_system: Canonical state is correctly preserved and activity history correctly records the refusal while the command denies that either operation or effect occurred.
    compatibility_effect: Restore failures use restore-specific language and report canonical-or-activity effects accurately; restore semantics are unchanged.
  - id: F030
    summary: An unexpected server construction or transport exception escapes the public command as a bare traceback.
    classification: implementation defect
    consequence: A connection failure lacks its failed stage, state effect, corrective action, and any simultaneous close/checkpoint warning.
    authority_refs:
      - VellisRequirements::simpleIndividualOperation
      - VellisRequirements::observableFailure
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_unexpected_mcp_runtime_failure_reports_its_stage_and_observed_effect
      - path:tests/vellis/test_cleanup_boundaries.py#test_unexpected_mcp_runtime_and_close_failures_are_both_reported
      - path:tests/vellis/test_cleanup_boundaries.py#test_mcp_process_control_failure_keeps_its_meaning_after_cleanup
    disposition: resolved
    owner_work_item_id: W006
    implementation_status: conforming
    nearest_wrong_system: Domain tool outcomes are correct while the process boundary fails outside the actionable owner contract.
    compatibility_effect: Ordinary runtime exceptions become structured serve failures; process-control exceptions retain their existing propagation.
  - id: F031
    summary: Failed and paused campaign worker results bypass current campaign, work-item, checkpoint, and state-token bindings.
    classification: implementation defect
    consequence: A stale or misrouted result can pass candidate validation and drive retry or failure handling for the wrong work.
    authority_refs:
      - AGENTS.md
      - .agents/skills/sysml-implementation-campaign/SKILL.md
    evidence_refs:
      - path:tests/test_implementation_campaign.py#test_noncheckpointed_worker_result_is_bound_to_current_work_and_state
      - path:tests/test_implementation_campaign.py#test_noncheckpointed_worker_result_cannot_claim_a_checkpoint
      - path:tests/test_implementation_campaign.py#test_noncheckpointed_present_review_token_must_match_current_state
    disposition: resolved
    owner_work_item_id: W007
    implementation_status: conforming
    nearest_wrong_system: Checkpoint advancement is strongly bound while a non-successful result from unrelated or stale work is accepted as current.
    compatibility_effect: Schema version 2 remains accepted; invalid paused and failed results are newly rejected.
  - id: F032
    summary: Security guidance still says the repository has no application implementation or runnable MCP server.
    classification: plan gap
    consequence: Reporters are directed by an obsolete threat and runtime scope that omits the implemented CLI, local store, snapshot, and STDIO boundary.
    authority_refs:
      - README.md
      - SECURITY.md
    evidence_refs:
      - path:SECURITY.md#current-scope
    disposition: resolved
    owner_work_item_id: W008
    implementation_status: conforming
    nearest_wrong_system: The application is runnable and locally stateful while its reporting policy describes only a model repository.
    compatibility_effect: Documentation only; no runtime or security boundary changes.
  - id: F033
    summary: Query discovery guidance does not explicitly identify anchor projection as the exact object-count workaround or explain the shared-data condition for multi-type groups.
    classification: plan gap
    consequence: A caller may silently undercount property-only tuples or expect a union group to reach per-type associated data without learning the correct existing alternatives.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_query_discovery_explains_identity_counts_and_multi_type_grounding
      - path:tests/vellis/test_graph_queries.py#test_projecting_anchors_preserves_identity_for_exact_object_counts
    disposition: resolved
    owner_work_item_id: W006
    implementation_status: conforming
    nearest_wrong_system: Query semantics are correct but the tool surface encourages a plausible, silently smaller answer.
    compatibility_effect: Advisory description only; query schemas, rows, aggregations, and bounds remain unchanged.
  - id: F034
    summary: The locked development dependency pypdf 6.14.2 has two known vulnerabilities fixed in 6.15.0.
    classification: implementation defect
    consequence: Pre-release dependency evidence claims a clean repository toolchain while reference tooling resolves a package version affected by PYSEC-2026-3655 and PYSEC-2026-3656.
    authority_refs:
      - SECURITY.md
      - AGENTS.md
    evidence_refs:
      - path:SECURITY.md#current-scope
      - command:just check
    disposition: resolved
    owner_work_item_id: W008
    implementation_status: conforming
    nearest_wrong_system: The shipped runtime is unaffected, but the repository's development and reference-tooling dependency set carries known fixable vulnerabilities while release evidence says otherwise.
    compatibility_effect: Development dependency refresh only; product runtime, stored meaning, and public interfaces are unchanged.
  - id: F035
    summary: Query guidance overstates row counting as an exact anchor count when other projections can repeat an anchor across distinct tuples.
    classification: plan gap
    consequence: A caller can overcount anchors when one anchor has several matching associated-data or link assignments, despite following the published identity guidance.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_anchor_count_uses_distinct_identity_when_other_projections_repeat_it
      - path:tests/vellis/test_mcp_boundary.py#test_query_discovery_explains_identity_counts_and_multi_type_grounding
    disposition: resolved
    owner_work_item_id: W008
    implementation_status: conforming
    nearest_wrong_system: Anchor-only counting is exact, but adding a one-to-many projection makes row count larger than the number of distinct projected anchor identities.
    compatibility_effect: Advisory description only; query schemas, evaluated tuples, aggregation, and bounds remain unchanged.
  - id: F036
    summary: Process-control exceptions during restore or fresh initialization bypass database close and checkpoint cleanup.
    classification: implementation defect
    consequence: An owner interruption can propagate after a canonical commit without attempting the repository's close/checkpoint path, leaving the owner without the cleanup guarantee needed before copying the database.
    authority_refs:
      - VellisRequirements::observableFailure
      - VellisRequirements::simpleIndividualOperation
      - VellisRequirements::freshInitialization
      - Vellis::'Restore prior personal memory'
    evidence_refs:
      - path:tests/vellis/test_cleanup_boundaries.py#test_restore_process_control_failure_keeps_its_meaning_after_cleanup
      - path:tests/vellis/test_setup_path.py#test_setup_process_control_failure_keeps_its_meaning_after_cleanup
    disposition: resolved
    owner_work_item_id: W009
    implementation_status: conforming
    nearest_wrong_system: Ordinary failures and server interruption close safely, while the same interruption during restore or setup escapes one line before cleanup begins.
    compatibility_effect: Process-control exceptions still propagate; cleanup is newly attempted first and a simultaneous checkpoint failure is attached without replacing the original exception.
  - id: F037
    summary: Paused and failed campaign results can claim passed checks and a clean state-bound review pair.
    classification: implementation defect
    consequence: Candidate validation accepts completion evidence that the non-checkpointed outcome is not permitted to claim, making a paused or failed handoff internally misleading even though it cannot advance a checkpoint.
    authority_refs:
      - AGENTS.md
      - .agents/skills/sysml-implementation-campaign/SKILL.md
    evidence_refs:
      - path:tests/test_implementation_campaign.py#test_noncheckpointed_worker_result_cannot_claim_completion_evidence
    disposition: resolved
    owner_work_item_id: W009
    implementation_status: conforming
    nearest_wrong_system: Campaign, work-item, state-token, reason, and null-checkpoint bindings all pass while a failed result falsely presents every check and both final reviews as clean.
    compatibility_effect: Worker-result schema version 2 remains unchanged; non-checkpointed results may still report failed or not-run checks and finding-bearing reviews, but not completion claims.
decisions:
  - id: D001
    summary: Replace only self-reaching definitions with the permissive JSON value they stand for, then inline the rest, at the boundary that already owns the wire form.
    authority_refs:
      - VellisRequirements::mcpAgentToolContract
    alternatives:
      - Annotate the recursive value type in the domain so its schema stops recursing, which would put a serialization concern inside domain meaning.
      - Hand-author all ten input schemas, which would duplicate the request types and drift from them.
      - Require clients to resolve references, which the contract forbids as an additional capability.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - Every published input schema carries no definitions block and no unresolved reference.
      - Every parameter carrying semantic input declares an object with members.
      - Definitions that do not reach themselves keep their typed meaning rather than being flattened.
      - Accepted requests, semantic refusals, and malformed input stay distinct and unchanged.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_published_input_schemas_carry_their_whole_meaning
      - path:tests/vellis/test_mcp_boundary.py#test_typed_current_change_and_bounded_query_round_trip
      - path:tests/vellis/test_mcp_boundary.py#test_semantic_rejection_is_typed_but_malformed_input_is_not_a_domain_result
  - id: D002
    summary: Evolution workflow tests select work items and findings by position in the dependency graph rather than by identifier.
    authority_refs:
      - AGENTS.md
    alternatives:
      - Name every future evolution's work to match the identifiers the tests expect, which freezes the record's inventory permanently.
      - Give the tests their own synthetic record, which would stop exercising the record the repository actually validates.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - The validator suite passes against a record whose work items and findings carry different identifiers.
      - Each case still asserts the rule it names, with identifiers resolved from the record under test.
    implementation_status: conforming
    evidence_refs:
      - command:uv run pytest tests/test_system_evolution.py -q
  - id: D003
    summary: Reading a JSON value is the value module's decision through its exact normalizer, not a union heuristic's.
    authority_refs:
      - VellisRequirements::canonicalSemanticEquality
    alternatives:
      - Mark the Boolean strict, which a caller validating leniently overrides, as the default tool path does.
      - Reorder the union so the exact decimal precedes the Boolean, which only moves the collision onto Booleans.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - One and zero remain numbers whether declared, nested in an array, or nested in an object.
      - True and false remain Booleans in the same positions.
      - Kind fidelity holds through the tool path a caller actually uses, not only through direct validation.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_mcp_boundary.py#test_a_stored_value_keeps_the_json_kind_the_caller_sent
  - id: D004
    summary: Ordered comparison extends to string-valued properties by exact Unicode code point, rather than making starter dates numeric or adding numeric companions.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::stringPatternValidation
      - EverydayLifeStarter
    alternatives:
      - Model starter dates as numbers, which keeps query meaning untouched but makes every stored date unreadable, discards the lexical shape rule, migrates every existing starter graph, and leaves every other string unorderable.
      - Add a numeric companion beside each patterned date, which creates two sources of truth for one fact and silently desynchronises when only one is written.
    reversible: false
    owner_work_item_id: W003
    evidence_intent:
      - A patterned date range is answerable without reading every candidate row.
      - Ordering follows exact code points, not case folding or locale collation, and matches for values outside ASCII.
      - The stored realization and the in-memory realization order identically.
      - Kinds that carry no order of their own stay rejected, as does a mismatched expected kind.
      - A pattern still describes which values are valid and never how two of them compare.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_a_string_property_orders_by_code_point
      - path:tests/vellis/test_graph_queries.py#test_string_ordering_agrees_between_the_stored_and_replayed_graph
      - command:uv run pytest tests/vellis/test_invalid_queries.py -q
  - id: D005
    summary: Assessment scope selection reaches definitions through the resolved current source tables rather than by definition-set identity.
    authority_refs:
      - VellisRequirements::validationCoverage
    alternatives:
      - Widen assessment to scan the whole active definition set, which trades a correctness defect for the unbounded work the model forbids.
      - Flatten the overlay into one set on activation, which discards the sharing that keeps an activation bounded.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - A removal orphaning a permission is refused after an unrelated activation, not only on a fresh system.
      - A removal orphaning only a multiplicity rule is refused on the same terms.
      - Assessment work stays bounded to the closure of what the edit touched.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_definition_governance.py#test_a_removal_that_orphans_a_reference_is_refused_after_an_earlier_activation
      - path:tests/vellis/test_definition_governance.py#test_a_removal_that_orphans_a_multiplicity_rule_is_refused_after_an_activation
      - command:uv run pytest tests/vellis/test_population_local_work.py -q
  - id: D006
    summary: Aggregation answers over the objects a data condition matched, and the caller's maximum bounds those matches exactly as it bounds a projected result.
    authority_refs:
      - VellisRequirements::semanticQueryMeaning
      - VellisRequirements::querySafety
    alternatives:
      - Document the deduplication hazard and leave the arithmetic to callers, which leaves every caller one forgotten projection away from a confidently wrong total.
      - Bound only the returned aggregate, which would let one number license reading an unbounded population and quietly turn the maximum into a display limit.
    reversible: false
    owner_work_item_id: W001
    evidence_intent:
      - An aggregate counts and sums matching objects, not distinct projected tuples.
      - A count of nothing is zero and a sum of nothing is absent.
      - A selection larger than the maximum is refused whole rather than aggregated in part.
      - Sum applies only to numbers; minimum and maximum order numbers and strings as an ordered comparison does.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_graph_queries.py#test_aggregation_counts_matching_objects_not_distinct_projected_tuples
      - path:tests/vellis/test_graph_queries.py#test_an_aggregate_is_absent_when_nothing_carries_the_property
      - path:tests/vellis/test_graph_queries.py#test_an_aggregated_selection_larger_than_the_maximum_is_refused_whole
      - command:uv run pytest tests/vellis/test_invalid_queries.py -q
  - id: D007
    summary: Restoration reaches the owner through the command line rather than through an eleventh agent tool.
    authority_refs:
      - VellisRequirements::mcpAgentToolContract
      - RTGSystem
    alternatives:
      - Expose restoration as an eleventh MCP tool, which breaks the selected ten-name contract and hands a recovery action to the surface that decides no authorization.
      - Leave it unreachable and document the gap, which leaves an owner with damaged memory no recourse at all.
    reversible: true
    owner_work_item_id: W001
    evidence_intent:
      - The owner can restore a selected revision and is asked before anything happens.
      - Declining leaves established memory exactly as it was.
      - Restoration commits forward as a new revision rather than erasing what followed.
    implementation_status: conforming
    evidence_refs:
      - path:tests/vellis/test_historical_restore.py#test_the_owner_can_reach_restoration_from_the_command_line
  - id: D008
    summary: An accepted approval binds to a checkpoint where the decision was open or already sealed, and whose gated consequence matches, rather than to one that already recorded the acceptance.
    authority_refs:
      - AGENTS.md
    alternatives:
      - Drop the checkpoint requirement and record approvals in prose, which loses the only durable evidence of what was put up for decision.
      - Allow an accepted approval with no checkpoint until a follow-up commit seals it, which leaves a window in which an unsealed acceptance validates.
    reversible: true
    owner_work_item_id: W003
    evidence_intent:
      - An acceptance can be recorded at all, against a checkpoint that shows the decision pending.
      - A checkpoint where the subject needed no decision is refused.
      - A consequence that changed since the checkpoint is refused.
    implementation_status: conforming
    evidence_refs:
      - path:tests/test_system_evolution.py#test_an_accepted_approval_binds_to_a_checkpoint_that_had_the_decision_open
