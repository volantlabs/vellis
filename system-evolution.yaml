    - Add numerical budgets or touch ignored owner data, external clients, releases, tags, merges, or pull-request state.
findings:
  - {id: F001, summary: "The query model mixes row and aggregate output and does not state all positive predicates as one joint binding.", classification: model gap, consequence: "Ambiguous output and component-specific evaluation legitimize machinery unrelated to simple positive pattern matching.", authority_refs: [RTG::'Graph Query', VellisRequirements::querySafety], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: accepted, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "Output is split while component products still define query meaning.", compatibility_effect: "Mixed output is removed; every finite positive pattern topology remains valid."}
  - {id: F002, summary: "Property-only projection collapses distinct source objects carrying equal values.", classification: model gap, consequence: "Rows cannot preserve object cardinality safely.", authority_refs: [RTG::'Returned Property', VellisRequirements::semanticQueryMeaning], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: accepted, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "Equal values remain indistinguishable when their source objects differ.", compatibility_effect: "Property row identity includes its source data UUID."}
  - {id: F003, summary: "Flat SQLite joins multiply hidden witnesses before late deduplication.", classification: implementation defect, consequence: "Work grows with combinations that cannot distinguish an answer.", authority_refs: [VellisRequirements::querySafety], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_graph_queries.py#test_unprojected_disconnected_population_does_not_multiply_projection_work, path:tests/vellis/test_query_contract_v2.py#test_sqlite_compiler_matches_parallel_self_and_cyclic_pattern], disposition: resolved, owner_work_item_id: W003, implementation_status: conforming, nearest_wrong_system: "SELECT DISTINCT acts only after hidden witness products.", compatibility_effect: "Positive conjunctive-pattern answers remain while unreturned variables become existential."}
  - {id: F004, summary: "The test oracle imports a second production assignment evaluator.", classification: plan gap, consequence: "Differential tests cannot expose shared semantic defects.", authority_refs: [VellisVerification::semanticQuery], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_query_contract_v2.py#test_independent_oracle_detects_a_mutated_compiler_result], disposition: resolved, owner_work_item_id: W003, implementation_status: conforming, nearest_wrong_system: "Named realizations agree because they share production semantics.", compatibility_effect: "No capability is lost; fallback evaluation is deleted."}
  - {id: F005, summary: "State selection uses parallel fields and arguments plus legacy middleware.", classification: model gap, consequence: "Equivalent meaning has invalid combinations and compatibility branches.", authority_refs: [RTG::'Graph Query', VellisRequirements::historicalStateCorrectness], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: accepted, owner_work_item_id: W001, implementation_status: conforming, nearest_wrong_system: "A tagged selector is added while old selector channels remain.", compatibility_effect: "One tagged state replaces prerelease overloads without translation."}
  - {id: F006, summary: "Authority does not exclude far-end promotion and participant-by-rule work precisely enough.", classification: model gap, consequence: "Correct findings can still use forbidden quadratic neighborhoods.", authority_refs: [VellisRequirements::explicitGraphChangeSet], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence], disposition: accepted, owner_work_item_id: W001, implementation_status: conflicting, nearest_wrong_system: "Every incident endpoint is affected even when its count cannot change.", compatibility_effect: "Findings remain complete; lookup-only identities stay unpromoted."}
  - {id: F007, summary: "Active endpoint-type changes expand a quadratic incident neighborhood.", classification: implementation defect, consequence: "Hub-of-hubs work grows quadratically.", authority_refs: [VellisRequirements::explicitGraphChangeSet], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_semantic_work_locality_triggers.py#test_active_endpoint_type_trigger_reproduces_quadratic_neighbor_work], disposition: implementation-work, owner_work_item_id: W004, implementation_status: conflicting, nearest_wrong_system: "Active validation promotes both endpoints of every incident relationship.", compatibility_effect: "Active validity and atomic rejection remain unchanged."}
  - {id: F008, summary: "Prospective multiplicity selection is reason-insensitive.", classification: implementation defect, consequence: "Display edits scale with irrelevant rules and independent changes form cross-products.", authority_refs: [VellisRequirements::validationCoverage], evidence_refs: [path:docs/mcp-realization.md#semantic-work-locality-trigger-evidence, path:tests/vellis/test_semantic_work_locality_triggers.py#test_display_only_trigger_reproduces_irrelevant_rule_dependency, path:tests/vellis/test_semantic_work_locality_triggers.py#test_independent_changes_reproduce_participant_by_rule_cross_product], disposition: implementation-work, owner_work_item_id: W004, implementation_status: conflicting, nearest_wrong_system: "Mentioned types select all rules and all changed participants enter each rule.", compatibility_effect: "Prospective findings and activation remain complete."}
