name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up pinned model references and validator
        run: just model-setup

      - name: Run checks
        run: just check

  install:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install exactly as documented
        run: |
          uv tool install git+https://github.com/volantlabs/vellis@${{ github.sha }}
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Confirm the owner command runs
        run: vellis --help

      - name: Initialize and audit a blank system
        run: |
          vellis setup --blank --no-connect --data-dir "$RUNNER_TEMP/vellis-data"
          vellis audit --data-dir "$RUNNER_TEMP/vellis-data"
