name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up pinned model references and validator
        run: just model-setup

      - name: Run checks
        run: just check
