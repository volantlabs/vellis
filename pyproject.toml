[project]
name = "vellis"
version = "0.2.0.dev0"
description = "A model-first exploration of the Vellis personal knowledge system."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vellis contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/volantlabs/vellis"
Issues = "https://github.com/volantlabs/vellis/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "jupyter-client>=8.6,<9",
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
]

[tool.basedpyright]
include = ["tools", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
