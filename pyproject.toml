[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vellis"
version = "2.0.0"
description = "A local-first personal-memory system built on a Reified Type Graph."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vellis contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "fastmcp==3.4.5",
    "pydantic==2.13.4",
    "uvicorn==0.52.1",
    "google-re2==1.1.20251105",
    "ijson==3.5.1",
]

[project.scripts]
vellis = "vellis.__main__:main"

[project.urls]
Repository = "https://github.com/volantlabs/vellis"
Issues = "https://github.com/volantlabs/vellis/issues"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["vellis*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "jupyter-client>=8.6,<9",
    "jsonschema>=4.25,<5",
    "pypdf>=6.15.0",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[tool.basedpyright]
include = ["vellis", "tools", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
