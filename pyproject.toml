[project]
name = "vellis"
version = "0.2.0.dev0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "jupyter-client>=8.6,<9",
    "jsonschema>=4.25,<5",
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
]

[tool.basedpyright]
include = ["tools", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
