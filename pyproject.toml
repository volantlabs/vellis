[project]
name = "vellis"
version = "0.2.0.dev0"
requires-python = ">=3.14"
dependencies = [
    # Pinned exactly, without a global prerelease allowance: the selected boundary is a
    # beta and the campaign records that choice, so a floating range would let it move
    # without anyone deciding to.
    "fastmcp==4.0.0b1",
    "fastmcp-slim==4.0.0b1",
    "google-re2>=1.1,<2",
    "ijson>=3.5.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "jupyter-client>=8.6,<9",
    "jsonschema>=4.25,<5",
    "pypdf>=6.15.0",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[tool.basedpyright]
include = ["vellis", "tools", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
